<style>
body { font-family: 'Inter', sans-serif; }
.rc-page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 72px; }
.rc-head h1 { display: flex; align-items: center; gap: 10px; font: 800 clamp(1.5rem, 4vw, 1.9rem)/1.2 'Sora', sans-serif; color: var(--color-text); }
.rc-head h1 svg { width: 0.85em; height: 0.85em; flex: none; color: var(--color-primary); }
.rc-head p { margin-top: 6px; color: var(--color-text-muted); }

/* category chips: one scrollable row, never wraps off-screen */
.rc-filters { display: flex; gap: 8px; margin: 18px -16px 20px; padding: 2px 16px 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.rc-filters::-webkit-scrollbar { display: none; }
.rc-chip { flex: none; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font: 600 0.9rem 'Inter', sans-serif; white-space: nowrap; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
.rc-chip:hover { border-color: var(--color-primary); }
.rc-chip[aria-pressed="true"] { background: var(--color-primary-solid); border-color: transparent; color: #fff; }
.rc-chip:focus-visible, .rc-card:focus-visible, .rc-btn:focus-visible { outline: 2px solid var(--color-primary-light); outline-offset: 2px; }

/* people grid */
.rc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.rc-card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px; border: 1px solid var(--color-border); border-radius: 20px; background: var(--color-surface); color: inherit; text-decoration: none; content-visibility: auto; contain-intrinsic-size: auto 150px; transition: border-color 0.15s ease; }
.rc-card:hover { border-color: var(--color-primary); }
.rc-top { display: flex; align-items: center; gap: 14px; min-width: 0; }
.rc-av { --h: 255; position: relative; width: 56px; height: 56px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font: 700 1.05rem 'Sora', sans-serif; background: hsl(var(--h) 70% 91%); color: hsl(var(--h) 55% 30%); }
@media (prefers-color-scheme: dark) { .rc-av { background: hsl(var(--h) 34% 26%); color: hsl(var(--h) 90% 88%); } }
:root[data-theme="dark"] .rc-av { background: hsl(var(--h) 34% 26%); color: hsl(var(--h) 90% 88%); }
:root[data-theme="light"] .rc-av { background: hsl(var(--h) 70% 91%); color: hsl(var(--h) 55% 30%); }
.rc-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rc-who { flex: 1; min-width: 0; }
.rc-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font: 700 1rem/1.3 'Sora', sans-serif; color: var(--color-text); }
.rc-user { margin-top: 2px; font-size: 0.88rem; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-tags { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.rc-tag { max-width: 100%; padding: 5px 11px; border-radius: 999px; background: var(--color-bg); color: var(--color-text-muted); font: 500 0.8rem/1.3 'Inter', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-tag.is-match { background: rgba(77, 208, 141, 0.14); color: var(--color-success); font-weight: 600; }
.rc-tag.none { font-style: italic; }
.rc-match { display: flex; align-items: center; gap: 6px; font: 600 0.82rem/1.3 'Inter', sans-serif; color: var(--color-success); }
.rc-match svg { width: 16px; height: 16px; flex: none; }

/* loading / empty / error */
.rc-skel { pointer-events: none; }
.rc-skel i { display: block; background: var(--color-border); border-radius: 8px; animation: rc-soft 1.4s ease-in-out infinite; }
.rc-skel .c { width: 56px; height: 56px; border-radius: 50%; flex: none; }
@keyframes rc-soft { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
.rc-state { grid-column: 1 / -1; display: grid; justify-items: center; gap: 14px; padding: 48px 16px; text-align: center; color: var(--color-text-muted); }
.rc-btn { min-height: 44px; padding: 0 22px; border-radius: 22px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font: 600 0.95rem 'Inter', sans-serif; cursor: pointer; transition: border-color 0.15s ease; }
.rc-btn:hover { border-color: var(--color-primary); }

@media (max-width: 640px) {
  .rc-page { padding: 16px 12px 56px; }
  .rc-filters { margin: 14px -12px 16px; padding: 2px 12px 6px; }
  .rc-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .rc-card { padding: 14px; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) { .rc-skel i { animation: none; } }
</style>

            <button type="button" class="rc-chip" data-category="O'yinlar" aria-pressed="false" data-i18n="search.cat_games">O'yinlar</button>

    <footer><span data-i18n="footer.tagline">BirMillat – qiziqishlar asosida do'stlar toping.</span> · <a href="/privacy" style="color:inherit;" data-i18n="foot.privacy">Maxfiylik siyosati</a><br><span style="opacity:0.8;" data-i18n-html="foot.founder">Founder — Bekhruz Ravshanov</span></footer>

    <script>
    (function () {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const safeUrl = (u) => (typeof u === 'string' && /^(https?:\/\/|\/(?!\/))/i.test(u) ? u : '');
        const HUES = [255, 278, 305, 335, 8, 28, 172, 200];
        const hueOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };
        const initials = (n) => { if (!n) return '?'; const p = n.trim().split(/\s+/); return (p.length > 1 ? p[0][0] + p[1][0] : p[0].slice(0, 2)).toUpperCase(); };

        // Language: saved preference on load, then follows the navbar switcher (<html lang>)
        let LANG = 'uz'; const DICTS = {};
        const loadDict = (l) => (l === 'uz' ? Promise.resolve({}) : DICTS[l] ? Promise.resolve(DICTS[l])
            : fetch('/i18n/' + l + '.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({})).then((d) => (DICTS[l] = d)));
        const T = (key, fb) => (DICTS[LANG] && DICTS[LANG][key]) || fb;

        let myInterests = [];
        let activeCategory = '';
        let token = 0;
        const cache = new Map();      // category → Promise<users[]>  (switching back is instant)
        const grid = $('usersGrid');

        const matches = (tag) => { const t = String(tag).toLowerCase(); return myInterests.some((i) => t.includes(i) || i.includes(t)); };
        const score = (tags) => { const th = (tags || []).map((t) => String(t).toLowerCase()); return myInterests.filter((i) => th.some((t) => t.includes(i) || i.includes(t))).length; };

        function cardHtml(u) {
            const name = u.name || u.username;
            const photo = safeUrl(u.photoUrl);
            const all = (u.interests || []).map((t) => ({ t, m: matches(t) }));
            all.sort((a, b) => b.m - a.m);                       // shared interests first
            const shown = all.slice(0, 3), extra = all.length - shown.length;
            const tags = all.length
                ? shown.map((x) => `<span class="rc-tag${x.m ? ' is-match' : ''}">#${esc(x.t)}</span>`).join('') + (extra > 0 ? `<span class="rc-tag">+${extra}</span>` : '')
                : `<span class="rc-tag none">${esc(T('common.no_interests', "Qiziqish ko'rsatilmagan"))}</span>`;
            const match = u.score > 0
                ? `<div class="rc-match"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>${u.score} ${esc(T('recommend.matches', 'mos qiziqish'))}</div>` : '';
            return `<a class="rc-card" href="/u/${encodeURIComponent(u.username)}">
                <div class="rc-top">
                    <span class="rc-av" style="--h:${hueOf(u.username)}">${esc(initials(name))}${photo ? `<img src="${esc(photo)}" alt="" width="56" height="56" loading="lazy" decoding="async">` : ''}</span>
                    <div class="rc-who"><div class="rc-name">${esc(name)}</div><div class="rc-user">@${esc(u.username)}</div></div>
                </div>
                <div class="rc-tags">${tags}</div>${match}</a>`;
        }

        function skeleton() {
            const card = '<div class="rc-card rc-skel"><div class="rc-top"><i class="c"></i><div class="rc-who"><i style="height:14px;width:60%"></i><i style="height:11px;width:35%;margin-top:8px"></i></div></div><div class="rc-tags"><i style="height:24px;width:70px;border-radius:12px"></i><i style="height:24px;width:90px;border-radius:12px"></i></div></div>';
            grid.innerHTML = card.repeat(6);
        }

        function stateHtml(msg, retry) {
            grid.innerHTML = `<div class="rc-state"><div>${esc(msg)}</div>${retry ? `<button type="button" class="rc-btn" id="rcRetry">${esc(T('mx.retry_load', 'Qayta urinish'))}</button>` : ''}</div>`;
            const b = $('rcRetry'); if (b) b.addEventListener('click', () => { cache.delete(activeCategory); show(activeCategory); });
        }

        function getUsers(cat) {
            if (!cache.has(cat)) {
                const p = fetch(cat ? `/api/search?category=${encodeURIComponent(cat)}` : '/api/search')
                    .then((r) => { if (!r.ok) throw new Error('bad status'); return r.json(); })
                    .catch((e) => { cache.delete(cat); throw e; });
                cache.set(cat, p);
            }
            return cache.get(cat);
        }

        function render(list) {
            if (!list.length) { stateHtml(T('recommend.empty', "Hozircha bu toifada foydalanuvchilar yo'q.")); return; }
            const users = list.map((u) => ({ ...u, score: score(u.interests) })).sort((a, b) => b.score - a.score);   // best matches first
            grid.innerHTML = users.map(cardHtml).join('');
        }

        async function show(cat) {
            const mine = ++token;                                  // a slower, older request can never overwrite a newer one
            const pending = getUsers(cat);
            const t = setTimeout(() => { if (mine === token) skeleton(); }, 120);   // no flash of skeleton on instant (cached) loads
            try {
                const list = await pending;
                if (mine !== token) return;
                clearTimeout(t); render(list); last = list;
            } catch (e) {
                clearTimeout(t);
                if (mine === token) stateHtml(T('vol.load_error', "Yuklab bo'lmadi. Sahifani qaytadan yuklang."), true);
            }
        }
        let last = null;

        $('filterBar').addEventListener('click', (e) => {
            const chip = e.target.closest('.rc-chip'); if (!chip) return;
            document.querySelectorAll('.rc-chip').forEach((c) => c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
            activeCategory = chip.getAttribute('data-category');
            show(activeCategory);
        });

        new MutationObserver(async () => {
            const attr = document.documentElement.getAttribute('lang') || 'uz';
            const next = attr === 'kaa' ? 'qq' : attr;
            if (next === LANG) return;
            await loadDict(next); LANG = next;
            if (last) render(last);
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

        async function loadMe() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login'; return; }
                const me = await res.json();
                $('userBadge').innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + esc(me.username);
                myInterests = (me.interests || []).map((i) => String(i).toLowerCase());
            } catch (e) { console.error('Failed to load profile:', e); }
        }

        (async function boot() {
            skeleton();
            LANG = (window.BirMillatI18n && window.BirMillatI18n.currentLang()) || 'uz';
            getUsers('').catch(() => {});                          // start the list request right away, in parallel with the profile + dictionary
            await Promise.all([loadMe(), loadDict(LANG)]);
            show('');
        })();
    })();
    </script>
