    <script>
    (function () {
        'use strict';

        /* ================= tiny helpers ================= */
        const $ = (s, r) => (r || document).querySelector(s);
        const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
        const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
        // Language: saved preference on load, then follows the navbar switcher (<html lang>).
        // Uzbek lives in this file as the fallback; other languages come from /i18n/*.json.
        let LANG = 'uz';
        const lang = () => LANG;
        const DICTS = {};
        function loadDict(l) {
            if (l === 'uz') return Promise.resolve({});
            if (DICTS[l]) return Promise.resolve(DICTS[l]);
            return fetch('/i18n/' + l + '.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({})).then((d) => (DICTS[l] = d));
        }
        // T(key, uzbekFallback, vars) — {name}-style placeholders are filled from vars
        const T = (key, fb, vars) => String((DICTS[LANG] && DICTS[LANG][key]) || fb)
            .replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : ''));
        const icon = (name, cls) => `<svg class="mx-i${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const isTouch = () => window.matchMedia('(pointer: coarse)').matches;
        const isVisible = () => document.visibilityState === 'visible';

        const MONTHS = {
            uz: ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'],
            ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
            en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
            qq: ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentyabr', 'oktyabr', 'noyabr', 'dekabr']
        };
        const WEEKDAYS = {
            uz: ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Jum', 'Shan'],
            ru: ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'],
            en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        };
        const pad = (n) => String(n).padStart(2, '0');
        const hhmm = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
        const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
        function dayLabel(ts) {
            const d = new Date(ts), now = new Date();
            const y = new Date(now); y.setDate(now.getDate() - 1);
            const k = dayKey(ts);
            if (k === dayKey(now)) return T('mx.today', 'Bugun');
            if (k === dayKey(y)) return T('mx.yesterday', 'Kecha');
            const l = lang(), m = (MONTHS[l] || MONTHS.uz)[d.getMonth()];
            const base = l === 'en' ? m + ' ' + d.getDate() : d.getDate() + ' ' + m;
            return d.getFullYear() === now.getFullYear() ? base : base + (l === 'en' ? ', ' : ' ') + d.getFullYear();
        }
        function listTime(ts) {
            if (!ts) return '';
            const d = new Date(ts), now = new Date();
            const y = new Date(now); y.setDate(now.getDate() - 1);
            const k = dayKey(ts);
            if (k === dayKey(now)) return hhmm(ts);
            if (k === dayKey(y)) return T('mx.yesterday', 'Kecha');
            if (now - d < 6 * 864e5) return (WEEKDAYS[lang()] || WEEKDAYS.uz)[d.getDay()];
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2);
        }

        const HUES = [255, 278, 305, 335, 8, 28, 172, 200];
        function hueOf(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }
        function initials(name) {
            const p = String(name || '?').trim().split(/\s+/);
            return (p.length > 1 ? p[0][0] + p[1][0] : p[0].slice(0, 2)).toUpperCase();
        }
        const safeUrl = (u) => (typeof u === 'string' && /^(https?:\/\/|\/(?!\/))/i.test(u) ? u : null);
        function avatar(u, size) {
            const img = safeUrl(u.photoUrl);
            return `<span class="mx-avwrap" style="--s:${size}px"><span class="mx-av" style="--h:${hueOf(u.username)}">${esc(initials(u.name || u.username))}${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}</span>${u.online ? '<i class="mx-dot"></i>' : ''}</span>`;
        }
        // A photo that fails to load simply disappears, revealing the initials underneath
        document.addEventListener('error', (e) => {
            if (e.target && e.target.tagName === 'IMG' && e.target.closest('.mx-av')) e.target.remove();
        }, true);

        // Escape first, then turn plain http(s)/www links into safe anchors
        function linkify(raw) {
            const out = []; let last = 0, m;
            const re = /(?:https?:\/\/|www\.)[^\s<>"'`]+/gi;
            while ((m = re.exec(raw))) {
                let url = m[0];
                const trail = url.match(/[.,;:!?)\]}»]+$/);
                if (trail) url = url.slice(0, -trail[0].length);
                if (!url) continue;
                out.push(esc(raw.slice(last, m.index)));
                const href = /^www\./i.test(url) ? 'https://' + url : url;
                out.push(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer nofollow">${esc(url)}</a>`);
                last = m.index + url.length;
                re.lastIndex = last;
            }
            out.push(esc(raw.slice(last)));
            return out.join('');
        }

        /* ================= state ================= */
        const S = {
            me: null, socket: null,
            convs: [], filter: '',
            active: null, user: null,
            msgs: [], byId: new Map(), seq: 0,
            token: 0, loading: false, queue: [],
            replyTo: null, drafts: {},
            typing: new Map(), lastTypingEmit: 0,
            jump: 0, pushed: false, hiddenUnread: false,
            dom: {}
        };
        const els = {
            shell: $('#mxShell'), chat: $('#mxChat'), rows: $('#mxRows'),
            filter: $('#mxFilter'), search: $('#mxSearch'), clear: $('#mxClear'),
            banner: $('#mxBanner'), menu: $('#mxMenu'), scrim: $('#mxScrim'),
            modal: $('#mxModal'), toast: $('#mxToast'), newChat: $('#mxNewChat')
        };
        const BASE_TITLE = document.title;

        function applyStaticLabels() {
            const nc = T('mx.new_chat', 'Yangi suhbat');
            els.newChat.title = nc; els.newChat.setAttribute('aria-label', nc);
            els.clear.setAttribute('aria-label', T('mx.clear', 'Tozalash'));
            els.filter.setAttribute('aria-label', T('mx.search_ph', 'Suhbatlarni qidirish'));
            els.filter.setAttribute('placeholder', T('mx.search_ph', 'Suhbatlarni qidirish'));
            $('.mx-list').setAttribute('aria-label', T('mx.convs', 'Suhbatlar'));
            els.chat.setAttribute('aria-label', T('mx.conv', 'Suhbat'));
        }

        /* ================= toast / dialog / menu ================= */
        let toastTimer = null;
        function toast(text) {
            els.toast.textContent = text;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2800);
        }

        function confirmDialog(opts) {
            return new Promise((resolve) => {
                const prev = document.activeElement;
                els.modal.innerHTML = `
                    <div class="mx-dialog" role="dialog" aria-modal="true" aria-labelledby="mxDlgT">
                        <h2 id="mxDlgT">${esc(opts.title)}</h2>
                        <p>${esc(opts.text)}</p>
                        <div class="actions">
                            <button type="button" class="mx-btn" data-r="0">${esc(T('mx.cancel', 'Bekor qilish'))}</button>
                            <button type="button" class="mx-btn danger" data-r="1">${esc(opts.confirm)}</button>
                        </div>
                    </div>`;
                els.modal.hidden = false;
                const btns = $$('button', els.modal);
                btns[0].focus();
                const done = (v) => {
                    els.modal.hidden = true; els.modal.innerHTML = '';
                    document.removeEventListener('keydown', onKey, true);
                    if (prev && prev.focus) prev.focus({ preventScroll: true });
                    resolve(v);
                };
                function onKey(e) {
                    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
                    else if (e.key === 'Tab') {
                        e.preventDefault();
                        const i = btns.indexOf(document.activeElement);
                        btns[(i + (e.shiftKey ? btns.length - 1 : 1)) % btns.length].focus();
                    }
                }
                document.addEventListener('keydown', onKey, true);
                els.modal.onclick = (e) => {
                    if (e.target === els.modal) return done(false);
                    const b = e.target.closest('button[data-r]');
                    if (b) done(b.dataset.r === '1');
                };
            });
        }

        let menuTarget = null, menuScrollTop = 0;
        function closeMenu() {
            if (els.menu.hidden) return;
            els.menu.hidden = true; els.scrim.hidden = true; els.menu.innerHTML = '';
            if (menuTarget) { menuTarget.classList.remove('is-targeted'); menuTarget = null; }
        }
        function openMenu(items, x, y, targetEl) {
            closeMenu();
            if (!items.length) return;
            els.menu.innerHTML = items.map((it, i) =>
                `<button type="button" role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${icon(it.icon)}<span>${esc(it.label)}</span></button>`).join('');
            els.menu.hidden = false; els.scrim.hidden = false;
            menuScrollTop = S.dom.scroll ? S.dom.scroll.scrollTop : 0;
            const w = els.menu.offsetWidth, h = els.menu.offsetHeight;
            const vw = window.innerWidth, vh = window.innerHeight, m = 8;
            let left = x, top = y;
            if (left + w > vw - m) left = Math.max(m, x - w);
            if (top + h > vh - m) top = Math.max(m, y - h);
            els.menu.style.left = Math.max(m, left) + 'px';
            els.menu.style.top = top + 'px';
            els.menu.style.setProperty('--ox', (x > left ? '100%' : '0'));
            els.menu.style.setProperty('--oy', (y > top ? '100%' : '0'));
            els.menu._items = items;
            if (targetEl) { menuTarget = targetEl; targetEl.classList.add('is-targeted'); }
            const first = $('button', els.menu); if (first && !isTouch()) first.focus({ preventScroll: true });
        }
        els.menu.addEventListener('click', (e) => {
            const b = e.target.closest('button[data-i]');
            if (!b) return;
            const it = els.menu._items[Number(b.dataset.i)];
            closeMenu();
            if (it && it.run) it.run();
        });
        els.menu.addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            e.preventDefault();
            const bs = $$('button', els.menu), i = bs.indexOf(document.activeElement);
            bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus();
        });
        els.scrim.addEventListener('pointerdown', (e) => { e.preventDefault(); closeMenu(); });
        els.scrim.addEventListener('contextmenu', (e) => { e.preventDefault(); closeMenu(); });

        /* ================= network helpers ================= */
        async function api(path) {
            const res = await fetch(path, { credentials: 'same-origin' });
            if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
            return res;
        }

        /* ================= conversation list ================= */
        function normalizeConv(c) {
            return {
                username: c.username, name: c.name || c.username, photoUrl: c.photoUrl || null,
                last: c.last_message || '', lastTime: c.last_time || 0,
                lastIsMine: c.lastIsMine != null ? !!c.lastIsMine : (S.me && c.last_sender_id === S.me.id),
                lastDeleted: !!c.lastIsDeleted,
                unread: c.unread || 0, online: !!c.online
            };
        }

        async function loadConversations() {
            try {
                const res = await api('/api/conversations');
                if (!res.ok) throw new Error('bad status');
                S.convs = (await res.json()).map(normalizeConv);
                if (S.active && isVisible()) {
                    const c = S.convs.find((x) => x.username === S.active);
                    if (c) c.unread = 0;
                }
                S.listError = false;
            } catch (e) {
                if (e.message === 'unauthorized') return;
                if (!S.convs.length) S.listError = true;
            }
            S.listLoaded = true;
            renderList();
            updateTitle();
            if (S.active) updateHeadStatus();
        }

        let listTimer = null;
        function refreshListSoon() {
            clearTimeout(listTimer);
            listTimer = setTimeout(loadConversations, 1200);
        }

        function touchConv(username, patch) {
            let c = S.convs.find((x) => x.username === username);
            if (!c) {
                c = { username, name: patch.name || username, photoUrl: null, last: '', lastTime: 0, lastIsMine: false, lastDeleted: false, unread: 0, online: false };
                S.convs.push(c);
            }
            Object.assign(c, patch);
            S.convs.sort((a, b) => b.lastTime - a.lastTime);
            renderList();
            updateTitle();
        }

        function updateTitle() {
            const n = S.convs.reduce((a, c) => a + (c.unread || 0), 0);
            document.title = (n ? '(' + (n > 99 ? '99+' : n) + ') ' : '') + BASE_TITLE;
        }

        function previewHtml(c) {
            if (S.typing.has(c.username)) return `<em class="typing">${esc(T('mx.typing', 'yozmoqda'))}…</em>`;
            if (c.lastDeleted) return `<i>${esc(T('mx.deleted', "Xabar o'chirildi"))}</i>`;
            const text = String(c.last || '').replace(/\s+/g, ' ').trim().slice(0, 140);
            return (c.lastIsMine ? `<span class="you">${esc(T('mx.you', 'Siz'))}: </span>` : '') + esc(text);
        }

        function renderList() {
            const rows = els.rows;
            if (!S.listLoaded) {
                rows.innerHTML = Array.from({ length: 7 }, () =>
                    '<div class="mx-skel-row"><div class="mx-skel circle"></div><div class="mx-skel-lines"><div class="mx-skel" style="height:13px;width:46%"></div><div class="mx-skel" style="height:12px;width:78%"></div></div></div>').join('');
                return;
            }
            if (S.listError) {
                rows.innerHTML = `<div class="mx-listmsg"><div>${esc(T('mx.load_fail', "Yuklab bo'lmadi"))}</div><button type="button" class="mx-btn" id="mxListRetry">${icon('resend')}${esc(T('mx.retry_load', 'Qayta urinish'))}</button></div>`;
                return;
            }
            const q = S.filter.trim().toLowerCase();
            const list = q ? S.convs.filter((c) => (c.name + ' ' + c.username + ' ' + c.last).toLowerCase().includes(q)) : S.convs;
            if (!S.convs.length) {
                rows.innerHTML = `<div class="mx-listmsg"><div><strong>${esc(T('mx.empty_title', "Hali suhbatlar yo'q"))}</strong>${esc(T('mx.empty_text', "Qiziqishlari o'xshash odamlarni toping va birinchi xabarni yuboring."))}</div><a class="mx-btn primary" href="/search">${icon('search')}${esc(T('mx.find_people', 'Odamlarni topish'))}</a></div>`;
                return;
            }
            if (!list.length) {
                rows.innerHTML = `<div class="mx-listmsg"><div>${esc(T('mx.no_results', '"{q}" bo\'yicha suhbat topilmadi', { q: S.filter.trim() }))}</div><a class="mx-btn" href="/search">${icon('search')}${esc(T('mx.find_people', 'Odamlarni topish'))}</a></div>`;
                return;
            }
            rows.innerHTML = list.map((c) => `
                <a class="mx-row${c.unread ? ' is-unread' : ''}" role="listitem" href="/messages?with=${encodeURIComponent(c.username)}" data-u="${esc(c.username)}"${c.username === S.active ? ' aria-current="true"' : ''}>
                    ${avatar(c, 52)}
                    <span class="mx-row-main">
                        <span class="mx-row-top"><span class="mx-row-name">${esc(c.name)}</span><time class="mx-row-time">${esc(listTime(c.lastTime))}</time></span>
                        <span class="mx-row-bot"><span class="mx-row-prev">${previewHtml(c)}</span>${c.unread ? `<span class="mx-badge" aria-label="${c.unread}">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}</span>
                    </span>
                </a>`).join('');
        }

        els.rows.addEventListener('click', (e) => {
            if (e.target.closest('#mxListRetry')) { S.listLoaded = false; renderList(); loadConversations(); return; }
            const a = e.target.closest('a.mx-row');
            if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
            e.preventDefault();
            openChat(a.dataset.u);
        });
        els.filter.addEventListener('input', () => {
            S.filter = els.filter.value;
            els.search.classList.toggle('has-value', !!S.filter);
            renderList();
        });
        els.filter.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && els.filter.value) { e.stopPropagation(); els.clear.click(); }
        });
        els.clear.addEventListener('click', () => {
            els.filter.value = ''; S.filter = ''; els.search.classList.remove('has-value');
            renderList(); els.filter.focus();
        });

        /* ================= views (list / chat) ================= */
        function setView(v) {
            els.shell.classList.toggle('is-chat', v === 'chat');
            els.shell.classList.toggle('is-list', v !== 'chat');
            document.body.classList.toggle('mx-in-chat', v === 'chat');
        }

        function renderEmptyPane() {
            S.dom = {};
            els.chat.innerHTML = `
                <div class="mx-empty">
                    <svg class="mx-loops" viewBox="0 0 90 90" fill="none" aria-hidden="true">
                        <g transform="translate(45 45)">
                            <g transform="rotate(-18)"><ellipse cx="-10" cy="0" rx="20" ry="36" stroke="var(--color-primary)" stroke-width="8"/></g>
                            <g transform="rotate(18)"><ellipse cx="10" cy="0" rx="20" ry="36" stroke="var(--color-accent)" stroke-width="8"/></g>
                        </g>
                    </svg>
                    <h2>${esc(T('mx.pick_title', 'Suhbatni tanlang'))}</h2>
                    <p>${esc(T('mx.pick_text', "Chap tomondan suhbatni tanlang yoki yangi odam toping."))}</p>
                    <a class="mx-btn primary" href="/search">${icon('search')}${esc(T('mx.find_people', 'Odamlarni topish'))}</a>
                </div>`;
        }

        /* ================= thread shell ================= */
        function renderThreadShell() {
            const u = S.user;
            const placeholder = T('mx.msg_ph', 'Xabar yozing…');
            els.chat.innerHTML = `
                <header class="mx-head">
                    <button type="button" class="mx-iconbtn mx-back" id="mxBack" aria-label="${esc(T('mx.back', 'Orqaga'))}">${icon('back')}</button>
                    <a class="mx-head-user" id="mxHeadUser" href="/u/${encodeURIComponent(u.username)}" title="${esc(T('mx.view_profile', "Profilni ko'rish"))}">
                        <span id="mxHeadAv">${avatar(u, 42)}</span>
                        <span class="mx-head-text"><span class="mx-head-name">${esc(u.name || u.username)}</span><span class="mx-head-status" id="mxStatus"></span></span>
                    </a>
                    <a class="mx-pill" href="/u/${encodeURIComponent(u.username)}" aria-label="${esc(T('mx.view_profile', "Profilni ko'rish"))}">${icon('user')}<span>${esc(T('mx.profile', 'Profil'))}</span></a>
                </header>
                <div class="mx-body">
                    <div class="mx-wall" aria-hidden="true"></div>
                    <div class="mx-scroll" id="mxScroll"><div id="mxMsgs"></div></div>
                    <button type="button" class="mx-jump" id="mxJump" aria-label="${esc(T('mx.jump', "Oxirgi xabarlarga o'tish"))}">${icon('down')}<span class="mx-badge" id="mxJumpN" hidden></span></button>
                </div>
                <form class="mx-composer" id="mxComposer" autocomplete="off">
                    <div class="mx-replybar" id="mxReplyBar" hidden></div>
                    <div class="mx-compose-row">
                        <div class="mx-field"><textarea id="mxInput" rows="1" maxlength="4000" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" enterkeyhint="${isTouch() ? 'enter' : 'send'}" autocapitalize="sentences"></textarea></div>
                        <button type="submit" class="mx-send" id="mxSend" aria-label="${esc(T('mx.send', 'Yuborish'))}" disabled>${icon('send')}</button>
                    </div>
                </form>`;
            S.dom = {
                scroll: $('#mxScroll'), msgs: $('#mxMsgs'), body: $('.mx-body', els.chat),
                input: $('#mxInput'), send: $('#mxSend'), jump: $('#mxJump'), jumpN: $('#mxJumpN'),
                replyBar: $('#mxReplyBar'), status: $('#mxStatus')
            };
            wireThread();
            updateHeadStatus();
        }

        function updateHead() {
            const u = S.user; if (!u || !S.dom.status) return;
            $('.mx-head-name', els.chat).textContent = u.name || u.username;
            $('#mxHeadAv', els.chat).innerHTML = avatar(u, 42);
            updateHeadStatus();
        }
        function updateHeadStatus() {
            const el = S.dom.status, u = S.user;
            if (!el || !u) return;
            const conv = S.convs.find((c) => c.username === u.username);
            if (conv) u.online = conv.online;
            if (S.typing.has(u.username)) {
                el.className = 'mx-head-status is-typing';
                el.innerHTML = esc(T('mx.typing', 'yozmoqda')) + '<span class="mx-dots" aria-hidden="true"><i></i><i></i><i></i></span>';
            } else if (u.online) {
                el.className = 'mx-head-status is-online';
                el.textContent = T('mx.online', 'onlayn');
            } else {
                el.className = 'mx-head-status';
                el.textContent = '@' + u.username;
            }
        }

        function wireThread() {
            const d = S.dom;
            $('#mxBack').addEventListener('click', goBack);
            d.scroll.addEventListener('scroll', onScroll, { passive: true });
            d.jump.addEventListener('click', () => { scrollBottom(true); });

            const ta = d.input;
            const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
            const sync = () => {
                d.send.disabled = !ta.value.trim();
                grow();
                if (S.active) S.drafts[S.active] = ta.value;
            };
            ta.addEventListener('input', () => {
                sync();
                const now = Date.now();
                if (ta.value.trim() && S.socket && S.socket.connected && now - S.lastTypingEmit > 2500) {
                    S.lastTypingEmit = now;
                    S.socket.emit('typing', { toUsername: S.active });
                }
            });
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch()) {
                    e.preventDefault();
                    submit();
                }
            });
            // Keep the keyboard open on phones when tapping Send
            d.send.addEventListener('pointerdown', (e) => e.preventDefault());
            $('#mxComposer').addEventListener('submit', (e) => { e.preventDefault(); submit(); });

            function submit() {
                const text = ta.value;
                if (!text.trim()) return;
                ta.value = ''; delete S.drafts[S.active]; sync();
                ta.focus({ preventScroll: true });
                sendMessage(text);
            }
            S.dom.sync = sync;

            d.replyBar.addEventListener('click', (e) => { if (e.target.closest('button')) clearReply(); });
            wireMessageGestures();
        }

        /* ================= scrolling ================= */
        function scrollBottom(smooth) {
            const s = S.dom.scroll; if (!s) return;
            s.scrollTo({ top: s.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
            S.jump = 0; renderJump();
        }
        function onScroll() {
            const s = S.dom.scroll;
            const dist = s.scrollHeight - s.scrollTop - s.clientHeight;
            S.dom.jump.classList.toggle('show', dist > 240);
            if (!els.menu.hidden && Math.abs(s.scrollTop - menuScrollTop) > 6) closeMenu();
            if (dist < 60 && S.jump) { S.jump = 0; renderJump(); }
        }
        function renderJump() {
            const n = S.dom.jumpN; if (!n) return;
            n.hidden = !S.jump; n.textContent = S.jump > 99 ? '99+' : S.jump;
        }

        /* ================= messages ================= */
        const quoteIsMine = (rt) => (rt.mine != null ? rt.mine : !!(S.me && rt.senderId === S.me.id));
        const tickName = (m) => (m.status === 'pending' ? 'clock' : m.status === 'failed' ? 'alert' : (m.isRead ? 'checks' : 'check'));

        function bubbleHtml(m) {
            if (m.isDeleted) {
                return `<div class="mx-bubble" tabindex="0">${icon('ban')}<span class="mx-text">${esc(T('mx.deleted', "Xabar o'chirildi"))}</span><span class="mx-meta"><time>${hhmm(m.createdAt)}</time></span></div>`;
            }
            let quote = '';
            if (m.replyTo) {
                const rt = m.replyTo;
                const name = quoteIsMine(rt) ? T('mx.you', 'Siz') : (S.user ? (S.user.name || S.user.username) : '');
                const gone = rt.isDeleted || !rt.content;
                quote = `<div class="mx-quote${gone ? ' is-gone' : ''}" data-reply="${esc(rt.id)}"><b>${esc(name)}</b><span>${esc(gone ? T('mx.deleted', "Xabar o'chirildi") : rt.content)}</span></div>`;
            }
            const tick = m.mine ? `<svg class="mx-tick" aria-hidden="true"><use href="#i-${tickName(m)}"/></svg>` : '';
            return `<div class="mx-bubble" tabindex="0">${quote}<span class="mx-text">${linkify(m.content)}</span><span class="mx-meta"><time>${hhmm(m.createdAt)}</time>${tick}</span></div>`;
        }

        function applyMsgClasses(m) {
            const el = m.el;
            el.classList.toggle('is-pending', m.status === 'pending');
            el.classList.toggle('is-failed', m.status === 'failed');
            el.classList.toggle('is-read', !!(m.mine && m.isRead));
            el.classList.toggle('is-deleted', !!m.isDeleted);
            if (m.id != null) el.dataset.id = m.id; else delete el.dataset.id;
        }
        function refreshEl(m) {
            if (!m.el) return;
            applyMsgClasses(m);
            const b = $('.mx-bubble', m.el);
            if (b) b.outerHTML = bubbleHtml(m);
        }

        function buildMsgEl(m, cont) {
            const el = document.createElement('div');
            el.className = 'mx-msg tail ' + (m.mine ? 'out' : 'in') + (cont ? ' cont' : '');
            el.innerHTML = `<span class="mx-swipe">${icon('reply')}</span>${bubbleHtml(m)}<button type="button" class="mx-more" tabindex="-1" aria-label="${esc(T('mx.actions', 'Amallar'))}">${icon('more')}</button>`;
            m.el = el; el._m = m;
            applyMsgClasses(m);
            return el;
        }

        function ensureDay(ts) {
            const host = S.dom.msgs, key = dayKey(ts);
            let day = host.lastElementChild;
            if (!day || day.dataset.day !== key) {
                day = document.createElement('div');
                day.className = 'mx-day'; day.dataset.day = key;
                day.innerHTML = `<div class="mx-date">${esc(dayLabel(ts))}</div>`;
                host.appendChild(day);
            }
            return day;
        }

        function addMessage(m, o) {
            o = o || {};
            const d = S.dom; if (!d.msgs) return;
            const start = $('.mx-start', d.body); if (start) start.remove();
            const nearBottom = d.scroll.scrollHeight - d.scroll.scrollTop - d.scroll.clientHeight < 140;
            const prev = S.msgs[S.msgs.length - 1];
            const cont = !!prev && prev.mine === m.mine && dayKey(prev.createdAt) === dayKey(m.createdAt) && (m.createdAt - prev.createdAt) < 300000;
            const el = buildMsgEl(m, cont);
            if (o.animate) el.classList.add('is-new');
            if (cont && prev.el) prev.el.classList.remove('tail');
            ensureDay(m.createdAt).appendChild(el);
            S.msgs.push(m);
            if (m.id != null) S.byId.set(m.id, m);
            if (o.silent) return;
            if (m.mine || nearBottom) scrollBottom(!!o.animate);
            else { S.jump++; renderJump(); S.dom.jump.classList.add('show'); }
        }

        function normalizeMsg(x) {
            return {
                id: x.id, mine: !!x.isMine, content: x.content || '', createdAt: x.createdAt,
                isRead: !!x.isRead, isDeleted: !!x.isDeleted, replyTo: x.replyTo || null, status: 'sent'
            };
        }

        function renderMessages() {
            const d = S.dom; if (!d.msgs) return;
            const list = S.msgs; S.msgs = []; S.byId.clear();
            d.msgs.innerHTML = '';
            list.forEach((m) => addMessage(m, { silent: true }));
            if (!list.length) renderStart();
            scrollBottom(false);
        }

        function renderStart() {
            const u = S.user, body = S.dom.body;
            if (!body || $('.mx-start', body)) return;
            const div = document.createElement('div');
            div.className = 'mx-start';
            div.innerHTML = `
                ${avatar(u, 84)}
                <h2>${esc(T('mx.start_title', '{name} bilan suhbatni boshlang', { name: u.name || u.username }))}</h2>
                <p>${esc(T('mx.start_text', "Birinchi xabar uchun bir nechta g'oya:"))}</p>
                <div class="mx-chips">
                    ${['mx.hi1|Assalomu alaykum! 👋', "mx.hi2|Salom! Tanishib olaylikmi?", "mx.hi3|Qaysi yo'nalishda faoliyat yuritasiz?"].map((s) => {
                        const [k, fb] = s.split('|');
                        return `<button type="button" class="mx-chip">${esc(T(k, fb))}</button>`;
                    }).join('')}
                </div>`;
            div.addEventListener('click', (e) => {
                const chip = e.target.closest('.mx-chip'); if (!chip) return;
                S.dom.input.value = chip.textContent;
                S.dom.sync(); S.dom.input.focus();
            });
            body.appendChild(div);
        }

        function showSkeleton() {
            const d = S.dom; if (!d.msgs) return;
            d.msgs.innerHTML = '<div class="mx-skel-msg mx-skel l"></div><div class="mx-skel-msg mx-skel r"></div><div class="mx-skel-msg mx-skel l w2"></div><div class="mx-skel-msg mx-skel r w2"></div><div class="mx-skel-msg mx-skel l"></div>';
        }

        function showThreadError() {
            const body = S.dom.body; if (!body) return;
            S.dom.msgs.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'mx-errbox';
            div.innerHTML = `<div>${esc(T('mx.load_fail', "Yuklab bo'lmadi"))}</div><button type="button" class="mx-btn">${icon('resend')}${esc(T('mx.retry_load', 'Qayta urinish'))}</button>`;
            $('button', div).addEventListener('click', () => { div.remove(); openChat(S.active, { force: true }); });
            body.appendChild(div);
        }

        /* ================= open / close ================= */
        async function openChat(username, o) {
            o = o || {};
            if (!username) return;
            closeMenu();
            if (S.active === username && !o.force && S.dom.msgs) { setView('chat'); S.dom.input && S.dom.input.focus({ preventScroll: true }); return; }
            if (S.active && S.dom.input) S.drafts[S.active] = S.dom.input.value;

            const token = ++S.token;
            const wasChat = !!S.active;
            S.active = username; S.replyTo = null; S.queue = []; S.loading = true;
            S.msgs = []; S.byId.clear(); S.jump = 0;
            const conv = S.convs.find((c) => c.username === username);
            S.user = { username, name: conv ? conv.name : username, photoUrl: conv ? conv.photoUrl : null, online: conv ? conv.online : false };

            const url = '/messages?with=' + encodeURIComponent(username);
            if (o.fromHistory) { /* URL already correct */ }
            else if (o.initial) { history.replaceState({ chat: username }, '', url); S.pushed = false; }
            else if (wasChat && S.pushed) history.replaceState({ chat: username }, '', url);
            else { history.pushState({ chat: username }, '', url); S.pushed = true; }

            setView('chat');
            renderThreadShell();
            showSkeleton();
            renderList();
            if (S.drafts[username]) { S.dom.input.value = S.drafts[username]; S.dom.sync(); }
            if (!isTouch()) S.dom.input.focus({ preventScroll: true });

            try {
                const res = await api('/api/messages/' + encodeURIComponent(username));
                if (token !== S.token) return;
                if (res.status === 404) { toast(T('mx.user_missing', 'Foydalanuvchi topilmadi')); closeChatView(); history.replaceState(null, '', '/messages'); return; }
                if (!res.ok) throw new Error('bad status');
                const data = await res.json();
                if (token !== S.token) return;
                const ou = data.otherUser || {};
                S.user = { username, name: ou.name || username, photoUrl: ou.photoUrl || null, online: !!ou.online };
                updateHead();
                S.msgs = data.messages.map(normalizeMsg);
                S.byId.clear();
                renderMessages();
                S.loading = false;
                // Anything that arrived while we were loading
                const q = S.queue; S.queue = [];
                q.forEach((m) => { if (!S.byId.has(m.id)) addMessage(m, { animate: true }); });
                const c = S.convs.find((x) => x.username === username);
                if (c) c.unread = 0;
                renderList(); updateTitle();
            } catch (e) {
                if (e.message === 'unauthorized' || token !== S.token) return;
                S.loading = false;
                showThreadError();
            }
        }

        function closeChatView() {
            if (S.active && S.dom.input) S.drafts[S.active] = S.dom.input.value;
            S.token++; S.active = null; S.user = null; S.loading = false; S.queue = [];
            S.msgs = []; S.byId.clear(); S.replyTo = null;
            closeMenu();
            renderEmptyPane();
            renderList();
            setView('list');
        }

        function goBack() {
            if (S.pushed) { history.back(); }
            else { closeChatView(); history.replaceState(null, '', '/messages'); }
        }

        window.addEventListener('popstate', () => {
            const w = new URLSearchParams(location.search).get('with');
            if (w) openChat(w, { fromHistory: true }); else { closeChatView(); S.pushed = false; }
        });

        /* ================= sending ================= */
        function sendMessage(text) {
            const content = text.trim();
            if (!content || !S.active) return;
            const m = {
                id: null, tempId: 't' + (++S.seq), mine: true, content, createdAt: Date.now(),
                isRead: false, isDeleted: false, status: 'pending', toUser: S.active,
                replyTo: S.replyTo ? { id: S.replyTo.id, mine: S.replyTo.mine, content: S.replyTo.text, isDeleted: false } : null
            };
            const replyId = S.replyTo ? S.replyTo.id : null;
            clearReply();
            addMessage(m, { animate: true });
            touchConv(m.toUser, { last: content, lastTime: m.createdAt, lastIsMine: true, lastDeleted: false, name: S.user && S.user.name });
            transmit(m, replyId);
        }

        function failMsg(m, reason) {
            m.status = 'failed';
            refreshEl(m);
            toast(reason || T('mx.send_fail', "Yuborilmadi. Qayta urinib ko'ring."));
        }

        function transmit(m, replyId) {
            m.status = 'pending'; refreshEl(m);
            if (!S.socket || !S.socket.connected) { failMsg(m, T('mx.offline_short', "Ulanish yo'q")); return; }
            let done = false;
            const timer = setTimeout(() => { if (!done) { done = true; failMsg(m); } }, 10000);
            S.socket.emit('send_message', { toUsername: m.toUser, content: m.content, replyToId: replyId }, (res) => {
                if (done) return;
                done = true; clearTimeout(timer);
                if (res && res.success) {
                    m.id = res.message.id; m.createdAt = res.message.createdAt || m.createdAt; m.status = 'sent';
                    S.byId.set(m.id, m);
                    refreshEl(m);
                    refreshListSoon();
                } else {
                    failMsg(m, res && res.error);
                }
            });
        }

        /* ================= reply ================= */
        const canReply = (m) => !m.isDeleted && m.id != null && m.status === 'sent';
        function startReply(m) {
            if (!canReply(m)) return;
            S.replyTo = { id: m.id, mine: m.mine, text: m.content };
            const name = m.mine ? T('mx.you', 'Siz') : (S.user.name || S.user.username);
            const bar = S.dom.replyBar;
            bar.hidden = false;
            bar.innerHTML = `${icon('reply')}<div class="t"><b>${esc(T('mx.replying_to', '{name} ga javob', { name }))}</b><span>${esc(m.content.replace(/\s+/g, ' '))}</span></div><button type="button" class="mx-iconbtn" aria-label="${esc(T('mx.cancel', 'Bekor qilish'))}">${icon('x')}</button>`;
            S.dom.input.focus({ preventScroll: true });
        }
        function clearReply() {
            S.replyTo = null;
            if (S.dom.replyBar) { S.dom.replyBar.hidden = true; S.dom.replyBar.innerHTML = ''; }
        }

        /* ================= message actions ================= */
        function copyText(text) {
            const ok = () => toast(T('mx.copied', 'Nusxalandi'));
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(ok, () => legacyCopy(text) && ok());
            } else if (legacyCopy(text)) ok();
        }
        function legacyCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
            document.body.appendChild(ta); ta.select();
            let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
            ta.remove(); return ok;
        }

        async function deleteMsg(m) {
            const yes = await confirmDialog({
                title: T('mx.del_title', "Xabarni o'chirasizmi?"),
                text: T('mx.del_text', "Xabar ikkala tomon uchun ham o'chiriladi."),
                confirm: T('mx.delete', "O'chirish")
            });
            if (!yes || !S.socket) return;
            S.socket.emit('delete_message', { messageId: m.id }, (res) => {
                if (!res || !res.success) toast((res && res.error) || T('mx.del_fail', "O'chirib bo'lmadi"));
            });
        }

        function discardMsg(m) {
            const i = S.msgs.indexOf(m); if (i < 0) return;
            S.msgs.splice(i, 1);
            const el = m.el, day = el.parentElement;
            el.remove();
            if (day && !$('.mx-msg', day)) day.remove();
            // re-evaluate grouping around the removed message
            const next = S.msgs[i], prev = S.msgs[i - 1];
            if (prev && prev.el && (!next || next.mine !== prev.mine || !next.el.classList.contains('cont'))) prev.el.classList.add('tail');
            if (!S.msgs.length) renderStart();
        }

        function menuItemsFor(m) {
            if (m.status === 'failed') {
                return [
                    { icon: 'resend', label: T('mx.retry', 'Qayta yuborish'), run: () => transmit(m, m.replyTo && m.replyTo.id) },
                    { icon: 'trash', label: T('mx.delete', "O'chirish"), danger: true, run: () => discardMsg(m) }
                ];
            }
            if (m.status === 'pending' || m.isDeleted) return [];
            const items = [
                { icon: 'reply', label: T('mx.reply', 'Javob berish'), run: () => startReply(m) },
                { icon: 'copy', label: T('mx.copy', 'Nusxalash'), run: () => copyText(m.content) }
            ];
            if (m.mine && m.id != null) items.push({ icon: 'trash', label: T('mx.delete', "O'chirish"), danger: true, run: () => deleteMsg(m) });
            return items;
        }

        function openMenuFor(msgEl, x, y) {
            const m = msgEl && msgEl._m; if (!m) return;
            openMenu(menuItemsFor(m), x, y, msgEl);
        }

        function markDeleted(id) {
            const m = S.byId.get(Number(id)); if (!m) return;
            m.isDeleted = true; m.content = '';
            refreshEl(m);
            // quotes that pointed at it
            S.msgs.forEach((x) => {
                if (x.replyTo && Number(x.replyTo.id) === Number(id)) { x.replyTo.isDeleted = true; x.replyTo.content = ''; refreshEl(x); }
            });
            const c = S.convs.find((c) => c.username === S.active);
            if (c && S.msgs[S.msgs.length - 1] === m) { c.lastDeleted = true; renderList(); }
            refreshListSoon();
        }

        function jumpToMessage(id) {
            const m = S.byId.get(Number(id));
            if (!m || !m.el) return;
            m.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            m.el.classList.remove('is-flash'); void m.el.offsetWidth; m.el.classList.add('is-flash');
            setTimeout(() => m.el.classList.remove('is-flash'), 1400);
        }

        /* ---- gestures: right-click, hover button, long-press, swipe-to-reply ---- */
        let ctxBlockUntil = 0;
        function wireMessageGestures() {
            const host = S.dom.msgs;

            host.addEventListener('click', (e) => {
                const more = e.target.closest('.mx-more');
                if (more) {
                    const r = more.getBoundingClientRect();
                    openMenuFor(more.closest('.mx-msg'), r.left, r.bottom + 4);
                    return;
                }
                const quote = e.target.closest('.mx-quote');
                if (quote) { jumpToMessage(quote.dataset.reply); return; }
                const msg = e.target.closest('.mx-msg');
                if (msg && msg._m && msg._m.status === 'failed' && !e.target.closest('a')) {
                    const r = msg.getBoundingClientRect();
                    openMenuFor(msg, e.clientX || r.left, e.clientY || r.bottom);
                }
            });
            host.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('mx-bubble')) {
                    e.preventDefault();
                    const r = e.target.getBoundingClientRect();
                    openMenuFor(e.target.closest('.mx-msg'), r.left + 24, r.bottom);
                }
            });
            host.addEventListener('contextmenu', (e) => {
                const msg = e.target.closest('.mx-msg');
                if (!msg) return;
                e.preventDefault();
                if (Date.now() < ctxBlockUntil) return;
                openMenuFor(msg, e.clientX, e.clientY);
            });

            let g = null;
            host.addEventListener('touchstart', (e) => {
                const msg = e.target.closest('.mx-msg');
                if (!msg || e.touches.length !== 1) { g = null; return; }
                const t0 = e.touches[0];
                g = { msg, x: t0.clientX, y: t0.clientY, dx: 0, swiping: false, moved: false };
                g.timer = setTimeout(() => {
                    if (!g || g.swiping || g.moved) return;
                    ctxBlockUntil = Date.now() + 900;
                    if (navigator.vibrate) navigator.vibrate(12);
                    openMenuFor(g.msg, g.x, g.y);
                    g.fired = true;
                }, 450);
            }, { passive: true });
            host.addEventListener('touchmove', (e) => {
                if (!g) return;
                const t0 = e.touches[0], dx = t0.clientX - g.x, dy = t0.clientY - g.y;
                if (Math.abs(dx) > 8 || Math.abs(dy) > 8) { g.moved = true; clearTimeout(g.timer); }
                if (!g.swiping && dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.4 && g.msg._m && canReply(g.msg._m)) g.swiping = true;
                if (g.swiping) {
                    g.dx = Math.max(dx, -84);
                    const b = $('.mx-bubble', g.msg), ic = $('.mx-swipe', g.msg);
                    b.style.transition = 'none';
                    b.style.transform = 'translateX(' + g.dx + 'px)';
                    ic.style.opacity = String(Math.min(1, -g.dx / 56));
                    ic.style.scale = String(0.6 + 0.4 * Math.min(1, -g.dx / 56));
                }
            }, { passive: true });
            const endGesture = () => {
                if (!g) return;
                clearTimeout(g.timer);
                if (g.swiping) {
                    const b = $('.mx-bubble', g.msg), ic = $('.mx-swipe', g.msg);
                    b.style.transition = ''; b.style.transform = ''; ic.style.opacity = ''; ic.style.scale = '';
                    if (g.dx <= -56) { if (navigator.vibrate) navigator.vibrate(10); startReply(g.msg._m); }
                }
                g = null;
            };
            host.addEventListener('touchend', endGesture, { passive: true });
            host.addEventListener('touchcancel', endGesture, { passive: true });
        }

        /* ================= realtime ================= */
        function markRead(username) {
            if (S.socket && S.socket.connected) S.socket.emit('mark_read', { withUsername: username });
            const c = S.convs.find((x) => x.username === username);
            if (c && c.unread) { c.unread = 0; renderList(); updateTitle(); }
            S.hiddenUnread = false;
        }

        function setTyping(username) {
            clearTimeout(S.typing.get(username));
            S.typing.set(username, setTimeout(() => { S.typing.delete(username); renderList(); updateHeadStatus(); }, 4500));
            renderList(); updateHeadStatus();
        }
        function clearTyping(username) {
            if (!S.typing.has(username)) return;
            clearTimeout(S.typing.get(username)); S.typing.delete(username);
        }

        function onNewMessage(p) {
            const from = p.senderUsername;
            if (!from) { // older server: no sender name in the event — resync instead of guessing
                refreshListSoon(); if (S.active) syncThread(); return;
            }
            clearTyping(from);
            const viewing = from === S.active && isVisible();
            if (from === S.active) {
                const m = { id: p.id, mine: false, content: p.content, createdAt: p.createdAt, isRead: false, isDeleted: false, replyTo: p.replyTo || null, status: 'sent' };
                if (S.loading) S.queue.push(m);
                else if (!S.byId.has(m.id)) addMessage(m, { animate: true });
                if (viewing) markRead(from); else S.hiddenUnread = true;
            }
            const c = S.convs.find((x) => x.username === from);
            touchConv(from, {
                last: p.content, lastTime: p.createdAt, lastIsMine: false, lastDeleted: false,
                name: (c && c.name) || p.senderName || from,
                unread: viewing ? 0 : ((c ? c.unread : 0) + 1)
            });
            updateHeadStatus();
            refreshListSoon();
        }

        // Pull the thread again and merge: used after a dropped connection
        async function syncThread() {
            const username = S.active; if (!username || S.loading) return;
            try {
                const res = await api('/api/messages/' + encodeURIComponent(username));
                if (!res.ok || username !== S.active) return;
                const data = await res.json();
                data.messages.forEach((x) => {
                    const known = S.byId.get(x.id);
                    if (!known) { addMessage(normalizeMsg(x), { animate: false }); return; }
                    if (known.isRead !== !!x.isRead || known.isDeleted !== !!x.isDeleted) {
                        known.isRead = !!x.isRead; known.isDeleted = !!x.isDeleted;
                        if (known.isDeleted) known.content = '';
                        refreshEl(known);
                    }
                });
            } catch (e) { /* silent */ }
        }

        function setupSocket() {
            if (typeof io !== 'function') { els.banner.hidden = false; return; }
            const sock = S.socket = io();
            let wasDown = false;
            sock.on('connect', () => {
                els.banner.hidden = true;
                if (wasDown) { wasDown = false; loadConversations(); if (S.active) syncThread(); }
            });
            sock.on('disconnect', () => { wasDown = true; els.banner.hidden = false; });
            sock.on('connect_error', () => { wasDown = true; els.banner.hidden = false; });
            sock.on('new_message', onNewMessage);
            sock.on('message_deleted', (d) => markDeleted(d.id));
            sock.on('messages_read', (d) => {
                if (!d || d.byUsername !== S.active) return;
                S.msgs.forEach((m) => { if (m.mine && m.status === 'sent' && !m.isRead) { m.isRead = true; refreshEl(m); } });
            });
            sock.on('typing', (d) => { if (d && d.fromUsername) setTyping(d.fromUsername); });
        }

        document.addEventListener('visibilitychange', () => {
            if (!isVisible()) return;
            if (S.active && S.hiddenUnread) markRead(S.active);
            loadConversations();
        });
        setInterval(() => { if (isVisible()) loadConversations(); }, 45000);

        /* ================= keyboard + viewport ================= */
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || e.defaultPrevented) return;
            if (!els.menu.hidden) { closeMenu(); return; }
            if (!els.modal.hidden) return;
            if (S.replyTo) { clearReply(); return; }
            if (S.active && !(e.target && e.target.id === 'mxFilter')) goBack();
        });
        window.addEventListener('wheel', (e) => { if (!els.menu.hidden && !els.menu.contains(e.target)) closeMenu(); }, { passive: true });
        window.addEventListener('resize', closeMenu);

        // On iPhones the on-screen keyboard shrinks only the *visual* viewport; keep the composer above it.
        if (window.visualViewport) {
            const root = document.documentElement;
            const fit = () => {
                const vv = window.visualViewport;
                if (isTouch() && window.innerHeight - vv.height > 120) {
                    root.style.setProperty('--mx-app-h', vv.height + 'px');
                    window.scrollTo(0, 0);
                    if (S.dom.scroll) scrollBottom(false);
                } else {
                    root.style.removeProperty('--mx-app-h');
                }
            };
            window.visualViewport.addEventListener('resize', fit);
            window.visualViewport.addEventListener('scroll', fit);
        }

        // Re-render dynamic text when the language is switched from the navbar
        new MutationObserver(async () => {
            const attr = document.documentElement.getAttribute('lang') || 'uz';
            const next = attr === 'kaa' ? 'qq' : attr;
            if (next === LANG) return;
            await loadDict(next);
            LANG = next;
            applyStaticLabels();
            renderList();
            if (S.active && S.dom.input) {
                const draft = S.dom.input.value;
                const keep = S.msgs.slice();
                renderThreadShell(); S.msgs = keep; renderMessages();
                S.dom.input.value = draft; S.dom.sync();
            } else if (!S.active) renderEmptyPane();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

        /* ================= boot ================= */
        (async function boot() {
            renderList();   // skeleton rows first (no text), so the page never looks blank
            LANG = (window.BirMillatI18n && window.BirMillatI18n.currentLang()) || 'uz';
            await loadDict(LANG);
            applyStaticLabels();
            renderEmptyPane();
            try {
                const res = await api('/api/me');
                S.me = await res.json();
                const badge = $('#userBadge');
                if (badge) badge.innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + esc(S.me.username);
            } catch (e) { return; }
            setupSocket();
            await loadConversations();
            const w = new URLSearchParams(location.search).get('with');
            if (w) openChat(w, { initial: true });
        })();
    })();
    </script>
</body>
