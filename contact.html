<!DOCTYPE html>
<html lang="uz">
<head>
<script src="/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirMillat – Aloqa</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/style.css">
<style>
body { font-family: 'Inter', sans-serif; }
.contact-shell { max-width: 880px; margin: 3rem auto; padding: 0 1.5rem 3rem; }
.contact-grid { display: grid; grid-template-columns: 280px 1fr; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-hover); }
@media (max-width: 760px) { .contact-grid { grid-template-columns: 1fr; } }

.contact-info {
    background: linear-gradient(155deg, var(--color-primary), #4A2F9E 65%, var(--color-accent-light));
    color: #FAF7F2; padding: 2.4rem 2rem; position: relative; overflow: hidden;
}
.contact-info::before { content:''; position:absolute; width:220px; height:220px; background:#FF6B5B; opacity:.25; filter:blur(70px); border-radius:50%; top:-70px; right:-60px; }
.contact-info h1 { font-family: 'Sora', sans-serif; font-size: 1.5rem; margin-bottom: 0.8rem; position: relative; }
.contact-info p { color: #D9D2EE; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.8rem; position: relative; }
.contact-info-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1rem; position: relative; font-size: 0.88rem; }
.contact-info-row .ic { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.contact-info-row a { color: #FAF7F2; text-decoration: none; font-weight: 600; }
.contact-info-row a:hover { text-decoration: underline; }

.contact-form-panel { background: var(--color-surface); padding: 2.4rem 2rem; }
.form-field { margin-bottom: 1.1rem; }
.form-field label {
    display: block; font-size: 0.8rem; font-weight: 700;
    color: var(--color-text-muted); margin-bottom: 0.4rem;
}
.form-field input, .form-field textarea {
    width: 100%; box-sizing: border-box; padding: 0.75rem 1rem; border-radius: var(--radius-sm);
    border: 1.5px solid var(--color-border); font-family: 'Inter', sans-serif;
    font-size: 0.95rem; resize: vertical; background: var(--color-bg); color: var(--color-text);
    transition: border-color .15s ease, box-shadow .15s ease;
}
.form-field input:focus, .form-field textarea:focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(45,27,105,0.1);
}
.submit-status { font-size: 0.88rem; margin-top: 0.8rem; min-height: 1.2em; }
.submit-status.success { color: var(--color-success); }
.submit-status.error { color: var(--color-error); }

.gradient-submit {
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
    color: #fff; font-weight: 700; font-size: 0.98rem; padding: 0.95rem; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    box-shadow: 0 10px 24px rgba(255,107,91,0.3);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.gradient-submit:hover { transform: scale(1.02); box-shadow: 0 14px 30px rgba(255,107,91,0.4); }
.gradient-submit:active { transform: scale(.96); }

@media (max-width: 560px) {
    .contact-shell { margin: 1.6rem auto; padding: 0 1rem 2.5rem; }
    .contact-info, .contact-form-panel { padding: 1.8rem 1.4rem; }
}
</style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><svg width="160" height="45" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" style="display:block;">
      <g transform="translate(45,45)">
        <g transform="rotate(-18)">
          <ellipse cx="-10" cy="0" rx="20" ry="36" fill="none" stroke="#2D1B69" stroke-width="10"/>
        </g>
        <g transform="rotate(18)">
          <ellipse cx="10" cy="0" rx="20" ry="36" fill="none" stroke="#FF6B5B" stroke-width="10"/>
        </g>
        <g transform="rotate(-18)">
          <path d="M -30 0 A 20 36 0 0 1 11 0" fill="none" stroke="#2D1B69" stroke-width="10" stroke-linecap="round"/>
        </g>
      </g>
      <text x="95" y="53" font-size="34" font-weight="700" fill="#2D1B69" font-family="Sora, -apple-system, sans-serif">Bir<tspan fill="#FF6B5B">Millat</tspan></text>
    </svg></a>
        <button class="nav-toggle" id="navToggle" aria-label="Menyu"><i class="fas fa-bars"></i></button>
        <div class="nav-links" id="navLinks">
            <button class="sidebar-close" id="sidebarClose" aria-label="Yopish"><i class="fas fa-xmark"></i></button>
            <a href="/login">Kirish</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Mavzuni almashtirish"><i class="fas fa-moon"></i></button>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="contact-shell reveal">
        <div class="contact-grid">
            <div class="contact-info">
                <h1><i class="fas fa-envelope"></i> Biz bilan bog'lanish</h1>
                <p>Reklama, hamkorlik yoki boshqa savollar bo'yicha murojaat qiling — xabaringiz to'g'ridan-to'g'ri jamoamizga yetib boradi.</p>
                <div class="contact-info-row"><span class="ic"><i class="fab fa-telegram"></i></span> <a href="https://t.me/birmillatUZB" target="_blank" rel="noopener">@birmillatUZB</a></div>
                <div class="contact-info-row"><span class="ic"><i class="fab fa-instagram"></i></span> <a href="https://instagram.com/birmillat.uz" target="_blank" rel="noopener">@birmillat.uz</a></div>
            </div>
            <div class="contact-form-panel">
                <form id="contactForm">
                    <div class="form-field">
                        <label for="nameInput">Ismingiz</label>
                        <input type="text" id="nameInput" placeholder="Ismingiz (ixtiyoriy)">
                    </div>
                    <div class="form-field">
                        <label for="contactInput">Aloqa uchun (telefon, Telegram, email)</label>
                        <input type="text" id="contactInput" placeholder="@username yoki +998...">
                    </div>
                    <div class="form-field">
                        <label for="messageInput">Xabar</label>
                        <textarea id="messageInput" rows="5" placeholder="Xabaringizni shu yerga yozing..." required></textarea>
                    </div>
                    <button type="submit" class="gradient-submit">
                        <i class="fas fa-paper-plane"></i> Yuborish
                    </button>
                    <div class="submit-status" id="submitStatus"></div>
                </form>
            </div>
        </div>
    </div>

    <footer>BirMillat – qiziqishlar asosida do'stlar toping. · <a href="/privacy" style="color:inherit;">Maxfiylik siyosati</a><br><span style="opacity:0.8;">Founder — Bekhruz Ravshanov</span></footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('submitStatus');
            const message = document.getElementById('messageInput').value.trim();

            if (!message) return;

            statusEl.textContent = 'Yuborilmoqda...';
            statusEl.className = 'submit-status';

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('nameInput').value.trim(),
                        contact: document.getElementById('contactInput').value.trim(),
                        message
                    })
                });
                if (!res.ok) throw new Error('Server error');

                statusEl.textContent = "Xabaringiz yuborildi! Tez orada javob beramiz.";
                statusEl.className = 'submit-status success';
                document.getElementById('contactForm').reset();
            } catch (err) {
                console.error('Contact submit failed:', err);
                statusEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
                statusEl.className = 'submit-status error';
            }
        });
    </script>
</body>
</html>
