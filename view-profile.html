<style>
body { font-family: 'Inter', sans-serif; }

.pr-layout {
    max-width: 980px; margin: 0 auto; padding: 1.8rem 1.5rem 3rem;
    display: grid; grid-template-columns: 268px 1fr; gap: 1.5rem; align-items: start;
}
@media (max-width: 820px) { .pr-layout { grid-template-columns: 1fr; } }

.pr-id-card { padding: 0; overflow: hidden; position: sticky; top: 1.5rem; }
@media (max-width: 820px) { .pr-id-card { position: static; } }
.pr-id-cover { height: 74px; background: linear-gradient(120deg, var(--color-primary), #6B4FC9 70%, var(--color-accent-light)); }
.pr-id-body { padding: 0 1.5rem 1.6rem; text-align: center; }
.pr-avatar-wrap { position: relative; width: 96px; height: 96px; margin: -48px auto 0.9rem; }
.avatar-img, .pr-avatar-wrap .avatar-circle {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: block;
    border: 4px solid var(--color-surface); background: linear-gradient(135deg,#EFEAF8,#E4DBF7);
    box-shadow: var(--shadow-hover);
}
.pr-avatar-wrap .avatar-circle {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-size: 2rem; font-weight: 700; color: var(--color-primary);
}
.pr-id-name { font-family: 'Sora', sans-serif; font-size: 1.25rem; margin: 0 0 0.15rem; }
.pr-id-username { color: var(--color-text-muted); font-size: 0.88rem; margin-bottom: 0.9rem; }
.pr-id-meta { display: flex; flex-direction: column; gap: 0.4rem; align-items: center; margin-bottom: 1.2rem; }
.pr-id-meta span { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--color-text-muted); }
.pr-id-meta i { color: var(--color-accent); width: 13px; }
.pr-id-actions { display: flex; flex-direction: column; gap: 0.6rem; }
.pr-id-actions .btn { width: 100%; justify-content: center; }

.pr-card { margin-bottom: 1.3rem; }
.pr-card:last-child { margin-bottom: 0; }
.pr-card .section-label { display: flex; align-items: center; gap: 0.5rem; }
.pr-card .section-label i { color: var(--color-accent); }
.profile-bio { font-size: 0.97rem; color: var(--color-text); line-height: 1.65; margin: 0.6rem 0 0; }
.profile-bio.empty { color: var(--color-text-muted); font-style: italic; }

.achievements-grid { display: flex; gap: 0.9rem; overflow-x: auto; padding: 0.9rem 0.1rem 0.3rem; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.achievements-grid::-webkit-scrollbar { height: 5px; }
.achievements-grid::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
.ach-card {
    flex: 0 0 128px; scroll-snap-align: start;
    border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden;
    cursor: pointer; transition: transform 0.2s cubic-bezier(.16,1,.3,1), box-shadow 0.2s ease;
    background: var(--color-surface);
}
.ach-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.ach-card img { width: 100%; height: 88px; object-fit: cover; display: block; }
.ach-card .ach-title { padding: 0.5rem 0.6rem; font-size: 0.78rem; font-weight: 700; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ach-empty { color: var(--color-text-muted); font-size: 0.85rem; }

.not-found { text-align: center; padding: 4rem 1.5rem; color: var(--color-text-muted); grid-column: 1 / -1; }
.not-found i { font-size: 2.4rem; color: var(--color-border); margin-bottom: 1rem; display: block; }

.ach-modal { display: none; position: fixed; inset: 0; background: rgba(26,22,37,0.55); z-index: 200; align-items: center; justify-content: center; padding: 1.5rem; }
.ach-modal.open { display: flex; }
.ach-modal-card { background: var(--color-surface); border-radius: var(--radius-md); max-width: 420px; width: 100%; overflow: hidden; max-height: 90vh; overflow-y: auto; }
.ach-modal-card img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.ach-modal-body { padding: 1.4rem; }
.ach-modal-body h3 { font-family: 'Sora', sans-serif; font-size: 1.1rem; margin-bottom: 0.4rem; }
.ach-modal-body .ach-date { font-size: 0.78rem; color: var(--color-text-muted); margin-bottom: 0.6rem; }
.ach-modal-body p { font-size: 0.92rem; color: var(--color-text); line-height: 1.5; }
.ach-modal-close {
    background: transparent; border: 1.5px solid var(--color-border); color: var(--color-text-muted);
    padding: 0.5rem 1rem; border-radius: var(--radius-pill); cursor: pointer; margin-top: 1rem; font-size: 0.85rem;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
}
.ach-modal-close:hover { transform: scale(1.05); }

.report-modal { display: none; position: fixed; inset: 0; background: rgba(26,22,37,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1.5rem; }
.report-modal.open, .report-modal[style*="flex"] { display: flex; }
.report-modal-card { max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.6rem; }
.report-modal-card h2 { font-family: 'Sora', sans-serif; font-size: 1.15rem; }
.report-field { margin-bottom: 1rem; }
.report-field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--color-text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.4px; }
.report-field select, .report-field textarea, .report-field input {
    width: 100%; box-sizing: border-box; padding: 0.7rem 0.9rem; border-radius: var(--radius-sm);
    border: 1.5px solid var(--color-border); font-family: 'Inter', sans-serif; font-size: 0.95rem; resize: vertical;
    background: var(--color-bg); color: var(--color-text);
}
</style>

    <div class="pr-layout reveal" id="profileRoot">
        <aside class="pr-id-card card">
            <div class="pr-id-cover"></div>
            <div class="pr-id-body">
                <div class="pr-avatar-wrap">
                    <img id="avatarPhoto" class="avatar-img" style="display:none;" alt="">
                    <div class="avatar-circle" id="avatarInitial">?</div>
                </div>
                <h1 class="pr-id-name" id="viewName">Yuklanmoqda...</h1>
                <div class="pr-id-username" id="viewUsername"></div>
                <div class="pr-id-meta" id="viewMeta"></div>
                <div class="pr-id-actions">
                    <a href="#" class="btn btn-primary btn-zoom" id="messageBtn"><i class="fas fa-paper-plane"></i> Xabar yuborish</a>
                    <button class="btn btn-cancel btn-zoom" id="reportBtn" style="border:1.5px solid var(--color-border); background:transparent; color:var(--color-text-muted);"><i class="fas fa-flag"></i> Shikoyat</button>
                </div>

        <main>

    <div class="ach-modal" id="achModal">

                <h3 id="achModalTitle"></h3>

                <button class="ach-modal-close" id="achModalClose">Yopish</button>
            </div>
        </div>

    <footer>BirMillat – qiziqishlar asosida do'stlar toping. · <a href="/privacy" style="color:inherit;">Maxfiylik siyosati</a><br><span style="opacity:0.8;">Founder — Bekhruz Ravshanov</span></footer>

    <div id="reportModal" class="report-modal">
        <div class="card report-modal-card">
            <h2 style="margin-bottom:1rem;"><i class="fas fa-flag" style="color:var(--color-accent);"></i> Shikoyat qilish</h2>
            <form id="reportForm">
                <div class="report-field">
                    <label>Sabab</label>
                    <select id="reportReason" required>
                        <option value="">Tanlang...</option>
                        <option value="Spam">Spam</option>
                        <option value="Haqorat / tahdid">Haqorat / tahdid</option>
                        <option value="Nomaqul kontent">Nomaqul kontent</option>
                        <option value="Soxta profil">Soxta profil</option>
                        <option value="Boshqa">Boshqa</option>
                    </select>
                </div>
                <div class="report-field">
                    <label>Tafsilotlar (ixtiyoriy)</label>
                    <textarea id="reportDetails" rows="3" placeholder="Nima bo'lganini qisqacha tushuntiring"></textarea>
                </div>
                <div class="report-field">
                    <label>Skrinshot (ixtiyoriy)</label>
                    <input type="file" id="reportScreenshot" accept="image/*" style="font-size:0.88rem;">
                </div>
                <div style="display:flex; gap:0.8rem;">
                    <button type="submit" class="btn btn-primary btn-zoom" style="flex:1; justify-content:center;">Yuborish</button>
                    <button type="button" class="btn btn-cancel" id="closeReportModal" style="border:1.5px solid var(--color-border); background:transparent; color:var(--color-text-muted);">Bekor qilish</button>
                </div>
                <div class="save-status" id="reportStatus" style="font-size:0.85rem; margin-top:0.6rem; min-height:1.2em;"></div>
            </form>
        </div>
    </div>

    <script>
        const reportedUsername = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');

        document.getElementById('reportBtn').addEventListener('click', () => {
            document.getElementById('reportModal').style.display = 'flex';
        });
        document.getElementById('closeReportModal').addEventListener('click', () => {
            document.getElementById('reportModal').style.display = 'none';
        });

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('reportStatus');
            const reason = document.getElementById('reportReason').value;
            const details = document.getElementById('reportDetails').value.trim();
            const fileInput = document.getElementById('reportScreenshot');

            if (!reason) return;

            statusEl.textContent = 'Yuborilmoqda...';
            statusEl.style.color = 'var(--color-text-muted)';

            try {
                const formData = new FormData();
                formData.append('reportedUsername', reportedUsername);
                formData.append('reason', reason);
                formData.append('details', details);
                if (fileInput.files[0]) {
                    formData.append('screenshot', fileInput.files[0]);
                }

                const res = await fetch('/api/report', { method: 'POST', body: formData });
                if (!res.ok) throw new Error('Server error');

                statusEl.textContent = 'Shikoyat yuborildi. Rahmat!';
                statusEl.style.color = 'var(--color-success)';
                setTimeout(() => {
                    document.getElementById('reportModal').style.display = 'none';
                    document.getElementById('reportForm').reset();
                    statusEl.textContent = '';
                }, 1500);
            } catch (err) {
                console.error('Report submit failed:', err);
                statusEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
                statusEl.style.color = 'var(--color-error)';
            }
        });
    </script>

    <script>
        function initials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].slice(0, 2).toUpperCase();
        }

        function getUsernameFromPath() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            return decodeURIComponent(parts[parts.length - 1] || '');
        }

        async function loadMe() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login'; return null; }
                const me = await res.json();
                document.getElementById('userBadge').innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + me.username;
                return me;
            } catch (e) {
                console.error('Failed to load own profile:', e);
                return null;
            }
        }

        async function loadProfile() {
            const username = getUsernameFromPath();
            const me = await loadMe();

            // Visiting your own public profile link — send to the editable version instead
            if (me && me.username === username) {
                window.location.href = '/profile';
                return;
            }

            try {
                const res = await fetch(`/api/users/${encodeURIComponent(username)}`);
                if (!res.ok) {
                    document.getElementById('profileRoot').innerHTML = `
                        <div class="not-found">
                            <i class="fas fa-user-slash"></i>
                            <p>Bu foydalanuvchi topilmadi.</p>
                        </div>`;
                    return;
                }
                const user = await res.json();

                if (user.photoUrl) {
                    document.getElementById('avatarPhoto').src = user.photoUrl;
                    document.getElementById('avatarPhoto').style.display = 'block';
                    document.getElementById('avatarInitial').style.display = 'none';
                } else {
                    document.getElementById('avatarInitial').textContent = initials(user.name || user.username);
                }
                document.getElementById('viewName').textContent = user.name || user.username;
                document.getElementById('viewUsername').textContent = '@' + user.username;

                const bioEl = document.getElementById('viewBio');
                if (user.bio && user.bio.trim()) {
                    bioEl.textContent = user.bio;
                    bioEl.classList.remove('empty');
                } else {
                    bioEl.textContent = "Bio qo'shilmagan.";
                    bioEl.classList.add('empty');
                }

                const metaParts = [];
                if (user.age) metaParts.push(`<span><i class="fas fa-cake-candles"></i> ${user.age} yosh</span>`);
                if (user.region) metaParts.push(`<span><i class="fas fa-location-dot"></i> ${user.region}</span>`);
                document.getElementById('viewMeta').innerHTML = metaParts.join('');

                const interestsEl = document.getElementById('viewInterests');
                const interests = user.interests || [];
                interestsEl.innerHTML = interests.length
                    ? interests.map(t => `<span class="tag">#${t}</span>`).join('')
                    : `<span class="tag" style="opacity:0.7">Qiziqish ko'rsatilmagan</span>`;

                document.getElementById('messageBtn').href = `/messages?with=${encodeURIComponent(user.username)}`;
                loadAchievements(user.username);
            } catch (e) {
                console.error('Failed to load profile:', e);
            }
        }

        function openAchievementModal(ach) {
            document.getElementById('achModalImage').src = ach.imageUrl;
            document.getElementById('achModalTitle').textContent = ach.title;
            document.getElementById('achModalDate').textContent = ach.achievedDate
                ? formatUzDate(ach.achievedDate)
                : '';
            document.getElementById('achModalDesc').textContent = ach.description || '';
            document.getElementById('achModal').classList.add('open');
        }

        document.getElementById('achModalClose').addEventListener('click', () => {
            document.getElementById('achModal').classList.remove('open');
        });
        document.getElementById('achModal').addEventListener('click', (e) => {
            if (e.target.id === 'achModal') document.getElementById('achModal').classList.remove('open');
        });

        async function loadAchievements(username) {
            const grid = document.getElementById('achievementsGrid');
            try {
                const res = await fetch(`/api/users/${encodeURIComponent(username)}/achievements`);
                if (!res.ok) return;
                const achievements = await res.json();

                if (achievements.length === 0) {
                    grid.innerHTML = `<span class="ach-empty">Hali yutuqlar qo'shilmagan</span>`;
                    return;
                }

                grid.innerHTML = '';
                achievements.forEach(ach => {
                    const card = document.createElement('div');
                    card.className = 'ach-card';
                    card.innerHTML = `<img src="${ach.imageUrl}" alt=""><div class="ach-title">${ach.title}</div>`;
                    card.addEventListener('click', () => openAchievementModal(ach));
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error('Failed to load achievements:', e);
            }
        }

        loadProfile();
    </script>
</body>
