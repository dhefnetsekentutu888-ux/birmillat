<!DOCTYPE html>
<html lang="uz">
<head>
<script src="/theme.js"></script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirMillat – Maqola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/style.css">
<style>
/* ==========================================================
   Article reading view — magazine layout: eyebrow + reading
   time, drop-cap opening, circular icon action buttons instead
   of the pill buttons used elsewhere in the app.
   ========================================================== */
body { font-family: 'Inter', sans-serif; }
.detail-shell { max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

.back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--color-text-muted); text-decoration: none; font-size: 0.86rem; font-weight: 600; margin-bottom: 1.4rem; transition: gap .15s ease, color .15s ease; }
.back-link:hover { color: var(--color-primary); gap: 0.75rem; }

.article-eyebrow { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; font-size: 0.82rem; color: var(--color-text-muted); font-weight: 600; }
.article-eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--color-text-muted); }
.article-eyebrow .badge { color: var(--color-accent); text-transform: uppercase; letter-spacing: 0.6px; font-size: 0.74rem; }

.detail-card { padding: 0; margin-bottom: 1.5rem; background: transparent; border: none; box-shadow: none; }
.detail-card h1 { font-family: 'Sora', sans-serif; font-size: clamp(1.6rem, 4vw, 2.3rem); margin-bottom: 1.4rem; line-height: 1.25; letter-spacing: -0.01em; }

.author-card {
    display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap;
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 18px;
    padding: 0.9rem 1.1rem; margin-bottom: 2rem;
}
.author-link { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; color: inherit; transition: opacity .15s ease; }
.author-link:hover { opacity: .78; }
.author-link .avatar {
    width: 42px; height: 42px; border-radius: 50%; padding: 2px;
    background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.author-link .avatar-inner {
    width: 100%; height: 100%; border-radius: 50%; background: var(--color-surface);
    display: flex; align-items: center; justify-content: center; font-size: 0.82rem; color: var(--color-primary);
    font-family: 'Sora', sans-serif; font-weight: 700; overflow: hidden;
}
.author-link .avatar-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.author-link .author-name { font-weight: 700; color: var(--color-text); font-size: 0.94rem; }
.author-link .author-date { font-size: 0.78rem; color: var(--color-text-muted); }

.article-body {
    line-height: 1.9; color: var(--color-text); white-space: pre-wrap; margin-bottom: 2.4rem; font-size: 1.05rem;
}
.article-body::first-letter {
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 3.4em; float: left;
    line-height: 0.82; padding: 0.05em 0.1em 0 0; color: var(--color-primary);
}

/* ---------- Circular icon action bar (distinct from the pill buttons elsewhere) ---------- */
.action-bar { display: flex; align-items: center; gap: 1rem; padding-top: 1.6rem; border-top: 1px solid var(--color-border); }
.icon-action-btn {
    position: relative; width: 50px; height: 50px; border-radius: 50%;
    border: 1.5px solid var(--color-border); background: var(--color-surface);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    color: var(--color-text-muted); cursor: pointer;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .15s ease, background .2s ease, color .15s ease, box-shadow .2s ease;
}
.icon-action-btn:hover { transform: scale(1.08); border-color: var(--color-primary); color: var(--color-primary); }
.icon-action-btn:active { transform: scale(.9); }
.icon-action-btn.like.liked {
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light));
    border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(255,107,91,0.35);
}
.icon-action-btn.like.just-liked i { animation: like-pop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes like-pop { 0% { transform: scale(1); } 45% { transform: scale(1.5); } 100% { transform: scale(1); } }
.like-count-badge {
    position: absolute; top: -5px; right: -5px; background: var(--color-primary); color: #fff;
    font-size: 0.64rem; font-weight: 800; padding: 0.14rem 0.36rem; border-radius: 999px; min-width: 18px; text-align: center;
    border: 2px solid var(--color-bg);
}
.icon-action-btn.danger:hover { border-color: var(--color-error); color: var(--color-error); }
.action-label { font-size: 0.78rem; color: var(--color-text-muted); font-weight: 600; }

.report-modal {
    display: none; position: fixed; inset: 0; background: rgba(26,22,37,0.5);
    z-index: 100; align-items: center; justify-content: center; padding: 1.5rem;
}
.report-modal.open { display: flex; }
.report-modal-card { max-width: 420px; width: 100%; padding: 1.6rem; }
.report-modal-card h2 { font-family: 'Sora', sans-serif; font-size: 1.15rem; }
.report-modal-card textarea {
    width: 100%; box-sizing: border-box; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-top: 0.8rem;
    border: 1.5px solid var(--color-border); font-family: 'Inter', sans-serif; font-size: 0.9rem; resize: vertical; min-height: 90px;
    background: var(--color-bg); color: var(--color-text);
}
.not-found { text-align: center; padding: 4rem 1.5rem; color: var(--color-text-muted); }

@media (max-width: 560px) {
    .detail-shell { padding: 1.4rem 1.1rem 2.5rem; }
    .icon-action-btn { width: 46px; height: 46px; }
}
</style>
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">
            <svg width="160" height="45" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" style="display:block;">
              <g transform="translate(45,45)">
                <g transform="rotate(-18)"><ellipse cx="-10" cy="0" rx="20" ry="36" fill="none" stroke="#2D1B69" stroke-width="10"/></g>
                <g transform="rotate(18)"><ellipse cx="10" cy="0" rx="20" ry="36" fill="none" stroke="#FF6B5B" stroke-width="10"/></g>
                <g transform="rotate(-18)"><path d="M -30 0 A 20 36 0 0 1 11 0" fill="none" stroke="#2D1B69" stroke-width="10" stroke-linecap="round"/></g>
              </g>
              <text x="95" y="53" font-size="34" font-weight="700" fill="#2D1B69" font-family="Sora, -apple-system, sans-serif">Bir<tspan fill="#FF6B5B">Millat</tspan></text>
            </svg>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Menyu"><i class="fas fa-bars"></i></button>
        <div class="nav-links" id="navLinks">
            <button class="sidebar-close" id="sidebarClose" aria-label="Yopish"><i class="fas fa-xmark"></i></button>
            <a href="/home"><i class="fas fa-house"></i> Bosh sahifa</a>
            <a href="/recommend"><i class="fas fa-wand-magic-sparkles"></i> Tavsiyalar</a>
            <a href="/events"><i class="fas fa-calendar-days"></i> Tadbirlar</a>
            <a href="/communities"><i class="fas fa-people-group"></i> Jamoalar</a>
            <a href="/articles" class="active"><i class="fas fa-newspaper"></i> Maqolalar</a>
            <a href="/search"><i class="fas fa-magnifying-glass"></i> Qidiruv</a>
            <a href="/messages"><i class="fas fa-comment-dots"></i> Xabarlar</a>
            <a href="/profile"><i class="fas fa-user"></i> Profil</a>
            <a href="/logout"><i class="fas fa-right-from-bracket"></i> Chiqish</a>
        </div>
        <div class="user-badge" id="userBadge"><img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ...</div>
    <div class="notif-bell-wrap">
        <button class="notif-bell" id="notifBell" aria-label="Bildirishnomalar"><i class="fas fa-bell"></i><span class="notif-dot" id="notifDot"></span></button>
        <div class="notif-panel" id="notifPanel">
            <div class="notif-panel-header">Bildirishnomalar</div>
            <div id="notifList"></div>
        </div>
    </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Mavzuni almashtirish"><i class="fas fa-moon"></i></button>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="detail-shell reveal" id="detailRoot">
        <a href="/articles" class="back-link"><i class="fas fa-arrow-left"></i> Maqolalar</a>
        <p style="color:var(--color-text-muted); text-align:center; padding:3rem 0;">Yuklanmoqda...</p>
    </div>

    <footer>BirMillat – qiziqishlar asosida do'stlar toping.<br><span style="opacity:0.8;">Founder — Bekhruz Ravshanov</span></footer>

    <div class="report-modal" id="reportModal">
        <div class="card report-modal-card">
            <h2 style="margin-bottom:0.4rem;"><i class="fas fa-flag" style="color:var(--color-accent);"></i> Maqolani shikoyat qilish</h2>
            <p style="font-size:0.85rem; color:var(--color-text-muted);">Nima uchun bu maqola qoidalarga zid deb o'ylaysiz?</p>
            <textarea id="reportReason" placeholder="Sabab (ixtiyoriy)"></textarea>
            <div style="display:flex; gap:0.8rem; margin-top:1rem;">
                <button class="btn btn-primary btn-zoom" id="submitReport" style="flex:1; justify-content:center;">Yuborish</button>
                <button class="btn btn-cancel" id="closeReportModal" style="border:1.5px solid var(--color-border); background:transparent; color:var(--color-text-muted);">Bekor qilish</button>
            </div>
            <div class="submit-status" id="reportStatus" style="font-size:0.85rem; margin-top:0.6rem;"></div>
        </div>
    </div>

    <script>
        function getArticleId() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            return parts[parts.length - 1];
        }

        function initials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].slice(0, 2).toUpperCase();
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return formatUzDate(d);
        }

        // Real, computed from the article's own word count — not a placeholder.
        function estimateReadMinutes(text) {
            const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
            return Math.max(1, Math.round(words / 180));
        }

        async function loadMe() {
            const res = await fetch('/api/me');
            if (!res.ok) { window.location.href = '/login'; return null; }
            const me = await res.json();
            document.getElementById('userBadge').innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + me.username;
            return me;
        }

        async function toggleLike(articleId) {
            try {
                const res = await fetch(`/api/articles/${articleId}/like`, { method: 'POST' });
                if (!res.ok) throw new Error();
                const data = await res.json();
                const btn = document.getElementById('likeBtn');
                btn.classList.toggle('liked', data.isLiked);
                document.getElementById('likeCountBadge').textContent = data.likeCount;
                if (data.isLiked) {
                    btn.classList.remove('just-liked');
                    void btn.offsetWidth;
                    btn.classList.add('just-liked');
                }
            } catch (e) {
                console.error('Like failed:', e);
            }
        }

        async function deleteOwnArticle(articleId) {
            if (!confirm("Maqolani o'chirishni tasdiqlaysizmi?")) return;
            try {
                const res = await fetch(`/api/articles/${articleId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                window.location.href = '/articles';
            } catch (e) {
                alert("Xatolik yuz berdi. Qaytadan urinib ko'ring.");
            }
        }

        async function loadArticle() {
            const articleId = getArticleId();
            const root = document.getElementById('detailRoot');

            try {
                const res = await fetch(`/api/articles/${articleId}`);
                if (!res.ok) {
                    root.innerHTML = `<a href="/articles" class="back-link"><i class="fas fa-arrow-left"></i> Maqolalar</a><div class="not-found"><i class="fas fa-file-circle-xmark" style="font-size:2.4rem; color:var(--color-border); display:block; margin-bottom:1rem;"></i><p>Bu maqola topilmadi yoki o'chirilgan.</p></div>`;
                    return;
                }
                const article = await res.json();
                const readMin = estimateReadMinutes(article.content);

                root.innerHTML = `
                    <a href="/articles" class="back-link"><i class="fas fa-arrow-left"></i> Maqolalar</a>
                    <div class="detail-card">
                        <div class="article-eyebrow">
                            <span class="badge"><i class="fas fa-newspaper"></i> Maqola</span>
                            <span class="dot"></span>
                            <span><i class="fas fa-clock"></i> ${readMin} daqiqa o'qish</span>
                        </div>
                        <h1>${article.title}</h1>
                        <div class="author-card">
                            <a href="/u/${article.author.username}" class="author-link">
                                <span class="avatar"><span class="avatar-inner">${article.author.photoUrl ? `<img src="${article.author.photoUrl}" alt="">` : initials(article.author.name || article.author.username)}</span></span>
                                <span>
                                    <div class="author-name">@${article.author.username}</div>
                                    <div class="author-date">${formatDate(article.createdAt)}</div>
                                </span>
                            </a>
                        </div>
                        <div class="article-body">${article.content}</div>
                        <div class="action-bar">
                            <button class="icon-action-btn like ${article.isLiked ? 'liked' : ''}" id="likeBtn" aria-label="Yoqtirish">
                                <i class="fas fa-heart"></i>
                                <span class="like-count-badge" id="likeCountBadge">${article.likeCount}</span>
                            </button>
                            ${article.isAuthor
                                ? `<button class="icon-action-btn danger" id="deleteBtn" aria-label="O'chirish"><i class="fas fa-trash"></i></button>`
                                : `<button class="icon-action-btn danger" id="reportBtn" aria-label="Shikoyat qilish"><i class="fas fa-flag"></i></button>`
                            }
                            <span class="action-label">${article.isAuthor ? "Maqolani o'chirish" : 'Shikoyat qilish'}</span>
                        </div>
                    </div>
                `;

                document.getElementById('likeBtn').addEventListener('click', () => toggleLike(article.id));

                const deleteBtn = document.getElementById('deleteBtn');
                if (deleteBtn) deleteBtn.addEventListener('click', () => deleteOwnArticle(article.id));

                const reportBtn = document.getElementById('reportBtn');
                if (reportBtn) {
                    reportBtn.addEventListener('click', () => {
                        document.getElementById('reportModal').classList.add('open');
                    });
                }

                document.getElementById('submitReport').onclick = async () => {
                    const statusEl = document.getElementById('reportStatus');
                    statusEl.textContent = 'Yuborilmoqda...';
                    statusEl.className = 'submit-status';
                    try {
                        const res = await fetch(`/api/articles/${article.id}/report`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ reason: document.getElementById('reportReason').value.trim() })
                        });
                        if (!res.ok) throw new Error();
                        statusEl.textContent = 'Shikoyat yuborildi. Rahmat!';
                        statusEl.className = 'submit-status success';
                        setTimeout(() => document.getElementById('reportModal').classList.remove('open'), 1200);
                    } catch (e) {
                        statusEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
                        statusEl.className = 'submit-status error';
                    }
                };
            } catch (e) {
                console.error('Failed to load article:', e);
                root.innerHTML = `<a href="/articles" class="back-link"><i class="fas fa-arrow-left"></i> Maqolalar</a><div class="not-found">Yuklab bo'lmadi. Sahifani qaytadan yuklang.</div>`;
            }
        }

        document.getElementById('closeReportModal').addEventListener('click', () => {
            document.getElementById('reportModal').classList.remove('open');
        });

        (async () => {
            await loadMe();
            loadArticle();
        })();
    </script>
</body>
</html>
