        function wireChat(c) {
            const d = S.dom;
            d.scroll.addEventListener('scroll', onScroll, { passive: true });
            d.jump.addEventListener('click', () => scrollBottom(true));
            $('#gcSub').addEventListener('click', openSheet);
            $('#gcOpenMembers').addEventListener('click', openSheet);

            const ta = d.input;
            const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
            const sync = () => { d.send.disabled = !ta.value.trim(); grow(); };
            ta.addEventListener('input', sync);
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch()) { e.preventDefault(); submit(); }
            });
            d.send.addEventListener('pointerdown', (e) => e.preventDefault());   // keep the phone keyboard open
            $('#mxComposer').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
            function submit() {
                const text = ta.value;
                if (!text.trim()) return;
                ta.value = ''; sync();
                ta.focus({ preventScroll: true });
                sendMessage(text);
            }
            d.sync = sync;
            d.replyBar.addEventListener('click', (e) => { if (e.target.closest('button')) clearReply(); });
            wireMessageGestures();

            if (c.isCreator) {
                const btn = $('#gcAvBtn'), file = $('#gcFile');
                btn.addEventListener('click', () => file.click());
                file.addEventListener('change', async () => {
                    const f = file.files[0]; if (!f) return;
                    try {
                        const fd = new FormData(); fd.append('image', f);
                        const res = await fetch('/api/communities/' + cid() + '/image', { method: 'POST', body: fd });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'Server');
                        S.community.imageUrl = data.imageUrl;
                        $('#gcAvInner').innerHTML = communityAvatar(data.imageUrl, 44);
                    } catch (err) { toast(err.message || T('gc.photo_fail', 'Rasmni yangilashda xatolik yuz berdi')); }
                    file.value = '';
                });
            }
        }

        /* ================= boot ================= */
        async function loadMe() {
            try {
                const res = await fetch('/api/me');
                const badge = $('#userBadge');
                if (!res.ok) { if (badge) badge.style.display = 'none'; return null; }
                const me = await res.json();
                S.me = me; S.myUsername = me.username;
                if (badge) badge.innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + esc(me.username);
                return me;
            } catch (e) { return null; }
        }

        async function loadCommunity() {
            try {
                const c = await fetchCommunity();
                if (!c) { renderGate(null, 'missing'); return; }
                if (c.isPreview) { renderGate(c, 'login'); return; }
                if (!c.isMember) { renderGate(c, 'join'); return; }
                renderChat(c);
                await loadMessages();
                if (S.socket && S.socket.connected) S.socket.emit('join_community', { communityId });
            } catch (e) {
                console.error('Failed to load community:', e);
                renderGate(null, 'error');
            }
        }

        function setupSocket() {
            if (typeof io !== 'function') { els.banner.hidden = false; return; }
            const sock = S.socket = io();
            let wasDown = false;
            sock.on('connect', () => {
                els.banner.hidden = true;
                sock.emit('join_community', { communityId });
                if (wasDown) { wasDown = false; syncMessages(); }
            });
            sock.on('disconnect', () => { wasDown = true; els.banner.hidden = false; });
            sock.on('connect_error', () => { wasDown = true; els.banner.hidden = false; });
            sock.on('new_community_message', (msg) => { if (Number(msg.communityId) === Number(communityId)) onIncoming(msg); });
            sock.on('community_message_deleted', (d) => { if (Number(d.communityId) === Number(communityId)) markDeleted(d.id); });
            sock.on('community_deleted', (d) => {
                if (Number(d.communityId) === Number(communityId)) {
                    toast(T('gc.deleted_alert', "Bu jamoa o'chirildi."));
                    setTimeout(() => { location.href = '/communities'; }, 1600);
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || e.defaultPrevented) return;
            if (!els.menu.hidden) { closeMenu(); return; }
            if (!els.modal.hidden) return;
            if (els.sheet.classList.contains('open')) { closeSheet(); return; }
            if (S.replyTo) clearReply();
        });
        window.addEventListener('wheel', (e) => { if (!els.menu.hidden && !els.menu.contains(e.target)) closeMenu(); }, { passive: true });
        window.addEventListener('resize', closeMenu);

        // iPhone keyboard: keep the composer visible above it
        if (window.visualViewport) {
            const root = document.documentElement;
            const fit = () => {
                const vv = window.visualViewport;
                if (isTouch() && window.innerHeight - vv.height > 120) {
                    root.style.setProperty('--mx-app-h', vv.height + 'px');
                    window.scrollTo(0, 0);
                    if (S.dom.scroll) scrollBottom(false);
                } else root.style.removeProperty('--mx-app-h');
            };
            window.visualViewport.addEventListener('resize', fit);
            window.visualViewport.addEventListener('scroll', fit);
        }

        // Re-render when the language is switched from the navbar
        new MutationObserver(async () => {
            const attr = document.documentElement.getAttribute('lang') || 'uz';
            const next = attr === 'kaa' ? 'qq' : attr;
            if (next === LANG) return;
            await loadDict(next);
            LANG = next;
            if (S.dom.input && S.community) {
                const draft = S.dom.input.value, keep = S.msgs.slice(), reply = S.replyTo;
                renderChat(S.community); S.msgs = keep; renderMessages();
                S.dom.input.value = draft; S.dom.sync();
                if (reply) { const m = keep.find((x) => x.id === reply.id); if (m) startReply(m); }
            } else if (S.community) renderGate(S.community, S.me ? 'join' : 'login');
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

        (async function boot() {
            LANG = (window.BirMillatI18n && window.BirMillatI18n.currentLang()) || 'uz';
            await loadDict(LANG);
            communityId = getCommunityId();
            const me = await loadMe();
            if (me) setupSocket();
            await loadCommunity();
        })();
    })();
    </script>
</body>
</html>
