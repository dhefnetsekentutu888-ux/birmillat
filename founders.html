<!doctype html>
<html lang="uz">
<head>
  <script src="/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ijtimoiy tarmoq va jamoa — BirMillat</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .ft-hero { position: relative; overflow: hidden; background: linear-gradient(160deg,#4A2F9E,#1C1148); color: #FAF7F2; padding: 5.5rem 1.5rem 3.5rem; text-align: center; }
    .ft-hero::before { content:''; position:absolute; width:300px; height:300px; background:#FF6B5B; opacity:.25; filter: blur(80px); border-radius:50%; top:-90px; right:-60px; }
    .ft-hero-icon { width: 60px; height: 60px; margin: 0 auto 1rem; border-radius: 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; position: relative; }
    .ft-hero h1 { font-family: 'Sora', sans-serif; color: #FAF7F2; font-size: clamp(2rem,5vw,2.9rem); margin: 0 0 .7rem; position: relative; }
    .ft-hero p { color: #D9D2EE; max-width: 600px; margin: 0 auto; line-height: 1.65; position: relative; }

    .ft-main { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .ft-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.8rem; flex-wrap: wrap; }
    .ft-back { text-decoration: none; font-weight: 600; color: var(--color-primary); display: inline-flex; align-items: center; gap: .4rem; }
    .ft-back:hover { text-decoration: underline; }
    .manage-btn { display: none; }

    .ft-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    .ft-card { overflow: hidden; padding: 0; transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; }
    .ft-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(45,27,105,.14); }
    .ft-photo-wrap { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #EFEAF8; }
    .ft-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
    .ft-card:hover .ft-photo-wrap img { transform: scale(1.05); }
    .ft-copy { padding: 1.3rem; }
    .ft-position { color: var(--color-accent); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin: 0 0 .4rem; }
    .ft-name { margin: 0 0 .6rem; font-size: 1.2rem; font-family: 'Sora', sans-serif; }
    .ft-description { margin: 0; color: var(--color-text-muted); font-size: .9rem; line-height: 1.6; white-space: pre-line; }

    .ft-social-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.1rem; }
    .ft-social-btn {
      display: inline-flex; align-items: center; gap: .4rem; text-decoration: none;
      font-size: .78rem; font-weight: 700; padding: .45rem .8rem; border-radius: 999px;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    }
    .ft-social-btn:hover { transform: scale(1.06); }
    .ft-social-btn:active { transform: scale(.93); }
    .ft-social-btn.instagram { background: linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7); color: #fff; }
    .ft-social-btn.telegram { background: #29A9EA; color: #fff; }
    .ft-social-btn.linkedin { background: #0A66C2; color: #fff; }

    .card-actions { display: none; gap: .6rem; margin-top: 1rem; }
    .ft-card.manageable .card-actions { display: flex; }
    .small-btn { border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-primary); border-radius: 999px; padding: .5rem .85rem; font: 600 .82rem 'Inter', sans-serif; cursor: pointer; }
    .small-btn:hover { border-color: var(--color-primary); }
    .small-btn.danger { color: #B42318; border-color: #F5B7B1; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 3rem 1rem; color: var(--color-text-muted); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 300; background: rgba(20,15,35,.55); display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--color-surface); width: min(560px,100%); max-height: 90vh; overflow: auto; border-radius: var(--radius-md); padding: 1.6rem; box-shadow: var(--shadow-hover); }
    .modal h2 { margin: 0 0 1rem; font-size: 1.3rem; font-family: 'Sora', sans-serif; }
    .form-field { display: block; margin: .85rem 0; font-size: .86rem; font-weight: 600; color: var(--color-text); }
    .form-field input, .form-field textarea { box-sizing: border-box; display: block; width: 100%; margin-top: .35rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: .72rem .8rem; font: 400 .95rem 'Inter', sans-serif; color: var(--color-text); background: var(--color-bg); }
    .form-field textarea { min-height: 100px; resize: vertical; }
    .form-subhead { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--color-text-muted); margin: 1.3rem 0 .3rem; }
    .form-actions { display: flex; justify-content: flex-end; gap: .7rem; margin-top: 1.3rem; }
    .form-note { color: var(--color-text-muted); font-size: .8rem; margin: .2rem 0; }
    .form-error { color: #B42318; font-size: .86rem; min-height: 1.2em; margin-top: .8rem; }
  </style>
</head>
<body>
  <section class="ft-hero">
    <div class="ft-hero-icon"><i class="fas fa-users"></i></div>
    <h1>Asoschilar va jamoa</h1>
    <p>BirMillat ortidagi insonlar bilan tanishing va ijtimoiy tarmoqlarda kuzatib boring.</p>
  </section>

  <main class="ft-main">
    <div class="ft-top">
      <a class="ft-back" href="/"><i class="fas fa-arrow-left"></i> Bosh sahifa</a>
      <button class="btn btn-primary manage-btn btn-zoom" id="addFounder" type="button">+ Jamoa a'zosini qo'shish</button>
    </div>
    <div class="ft-grid" id="foundersGrid" aria-live="polite"></div>
  </main>

  <div class="modal-backdrop" id="editorBackdrop" aria-hidden="true">
    <form class="modal" id="founderForm">
      <h2 id="editorTitle">Jamoa a'zosini qo'shish</h2>
      <input type="hidden" id="founderId">
      <label class="form-field">Ism
        <input id="founderName" maxlength="100" required>
      </label>
      <label class="form-field">Lavozim
        <input id="founderPosition" maxlength="120" placeholder="Masalan: Founder & CEO" required>
      </label>
      <label class="form-field">Tavsif
        <textarea id="founderDescription" maxlength="1200" required placeholder="Jamoa a'zosi haqida qisqacha ma'lumot"></textarea>
      </label>
      <label class="form-field">Tartib raqami
        <input id="founderSortOrder" type="number" value="0">
      </label>
      <label class="form-field">Rasm <span id="photoRequired">*</span>
        <input id="founderPhoto" type="file" accept="image/*">
      </label>
      <p class="form-note">Tahrirlashda rasm tanlanmasa, avvalgi rasm saqlanadi.</p>

      <div class="form-subhead"><i class="fas fa-share-nodes"></i> Ijtimoiy tarmoqlar (ixtiyoriy)</div>
      <label class="form-field"><i class="fab fa-instagram"></i> Instagram havolasi
        <input id="founderInstagram" type="url" placeholder="https://instagram.com/...">
      </label>
      <label class="form-field"><i class="fab fa-telegram"></i> Telegram havolasi
        <input id="founderTelegram" type="url" placeholder="https://t.me/...">
      </label>
      <label class="form-field"><i class="fab fa-linkedin"></i> LinkedIn havolasi
        <input id="founderLinkedin" type="url" placeholder="https://linkedin.com/in/...">
      </label>

      <div class="form-error" id="formError" role="alert"></div>
      <div class="form-actions">
        <button class="btn btn-outline" type="button" id="cancelEditor">Bekor qilish</button>
        <button class="btn btn-primary" type="submit">Saqlash</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      var grid = document.getElementById('foundersGrid');
      var backdrop = document.getElementById('editorBackdrop');
      var form = document.getElementById('founderForm');
      var canManage = false;
      var founders = [];

      function createText(tag, className, value) {
        var el = document.createElement(tag);
        el.className = className;
        el.textContent = value;
        return el;
      }

      function socialButton(href, cls, icon, label) {
        if (!href) return null;
        var a = document.createElement('a');
        a.className = 'ft-social-btn ' + cls;
        a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.innerHTML = '<i class="fab fa-' + icon + '"></i> ' + label;
        return a;
      }

      function render() {
        grid.innerHTML = '';
        if (!founders.length) {
          grid.appendChild(createText('div', 'empty-state', "Jamoa a'zolari tez orada qo'shiladi."));
          return;
        }
        founders.forEach(function (founder) {
          var card = document.createElement('article');
          card.className = 'ft-card card' + (canManage ? ' manageable' : '');

          var photoWrap = document.createElement('div');
          photoWrap.className = 'ft-photo-wrap';
          var image = document.createElement('img');
          image.src = founder.photoUrl;
          image.alt = founder.name;
          image.loading = 'lazy';
          photoWrap.appendChild(image);
          card.appendChild(photoWrap);

          var copy = document.createElement('div');
          copy.className = 'ft-copy';
          copy.appendChild(createText('p', 'ft-position', founder.position));
          copy.appendChild(createText('h2', 'ft-name', founder.name));
          copy.appendChild(createText('p', 'ft-description', founder.description));

          var social = document.createElement('div');
          social.className = 'ft-social-row';
          var btns = [
            socialButton(founder.instagramUrl, 'instagram', 'instagram', 'Instagram'),
            socialButton(founder.telegramUrl, 'telegram', 'telegram', 'Telegram'),
            socialButton(founder.linkedinUrl, 'linkedin', 'linkedin', 'LinkedIn')
          ].filter(Boolean);
          if (btns.length) {
            btns.forEach(function (b) { social.appendChild(b); });
            copy.appendChild(social);
          }

          if (canManage) {
            var actions = document.createElement('div');
            actions.className = 'card-actions';
            var edit = document.createElement('button');
            edit.type = 'button'; edit.className = 'small-btn'; edit.textContent = 'Tahrirlash';
            edit.addEventListener('click', function () { openEditor(founder); });
            var remove = document.createElement('button');
            remove.type = 'button'; remove.className = 'small-btn danger'; remove.textContent = "O'chirish";
            remove.addEventListener('click', function () { removeFounder(founder); });
            actions.append(edit, remove); copy.appendChild(actions);
          }
          card.appendChild(copy);
          grid.appendChild(card);
        });
      }

      function openEditor(founder) {
        document.getElementById('founderId').value = founder ? founder.id : '';
        document.getElementById('founderName').value = founder ? founder.name : '';
        document.getElementById('founderPosition').value = founder ? founder.position : '';
        document.getElementById('founderDescription').value = founder ? founder.description : '';
        document.getElementById('founderSortOrder').value = founder ? (founder.sortOrder || 0) : 0;
        document.getElementById('founderPhoto').value = '';
        document.getElementById('founderInstagram').value = founder ? (founder.instagramUrl || '') : '';
        document.getElementById('founderTelegram').value = founder ? (founder.telegramUrl || '') : '';
        document.getElementById('founderLinkedin').value = founder ? (founder.linkedinUrl || '') : '';
        document.getElementById('editorTitle').textContent = founder ? "Jamoa a'zosini tahrirlash" : "Jamoa a'zosini qo'shish";
        document.getElementById('photoRequired').style.display = founder ? 'none' : '';
        document.getElementById('formError').textContent = '';
        backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden', 'false');
      }
      function closeEditor() { backdrop.classList.remove('open'); backdrop.setAttribute('aria-hidden', 'true'); }

      async function load() {
        var responses = await Promise.all([fetch('/api/founders'), fetch('/api/founders/manage')]);
        founders = await responses[0].json();
        var access = await responses[1].json();
        canManage = !!access.canManage;
        if (canManage) document.getElementById('addFounder').style.display = 'inline-flex';
        render();
      }

      async function removeFounder(founder) {
        if (!confirm(founder.name + " haqidagi ma'lumot o'chirilsinmi?")) return;
        var response = await fetch('/api/founders/' + founder.id, { method: 'DELETE' });
        if (!response.ok) return alert("O'chirib bo'lmadi.");
        await load();
      }

      document.getElementById('addFounder').addEventListener('click', function () { openEditor(null); });
      document.getElementById('cancelEditor').addEventListener('click', closeEditor);
      backdrop.addEventListener('click', function (event) { if (event.target === backdrop) closeEditor(); });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var id = document.getElementById('founderId').value;
        var photo = document.getElementById('founderPhoto').files[0];
        if (!id && !photo) { document.getElementById('formError').textContent = 'Rasm tanlang.'; return; }
        var data = new FormData();
        data.append('name', document.getElementById('founderName').value);
        data.append('position', document.getElementById('founderPosition').value);
        data.append('description', document.getElementById('founderDescription').value);
        data.append('sortOrder', document.getElementById('founderSortOrder').value);
        data.append('instagramUrl', document.getElementById('founderInstagram').value);
        data.append('telegramUrl', document.getElementById('founderTelegram').value);
        data.append('linkedinUrl', document.getElementById('founderLinkedin').value);
        if (photo) data.append('photo', photo);
        var response = await fetch(id ? '/api/founders/' + id : '/api/founders', { method: id ? 'PUT' : 'POST', body: data });
        if (!response.ok) {
          var body = await response.json().catch(function () { return {}; });
          document.getElementById('formError').textContent = body.error || "Saqlab bo'lmadi.";
          return;
        }
        closeEditor(); await load();
      });

      load().catch(function () { grid.innerHTML = '<div class="empty-state">Ma\'lumotlarni yuklab bo\'lmadi.</div>'; });
    })();
  </script>
</body>
</html>
