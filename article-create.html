<!DOCTYPE html>
<html lang="uz">
<head>
<script src="/theme.js"></script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirMillat – Maqola yozish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/style.css">
<style>
/* ==========================================================
   Article composer — a plain, borderless "writing surface"
   instead of a boxed form, with a floating publish bar that
   shows a live word count. Deliberately different feel from
   the standard card-form pattern used elsewhere.
   ========================================================== */
body { font-family: 'Inter', sans-serif; }
.compose-shell { max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem 7rem; }

.compose-eyebrow { display: flex; align-items: center; gap: 0.6rem; color: var(--color-accent); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 1.1rem; }

.rules-note {
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px;
    padding: 0.85rem 1.1rem; font-size: 0.83rem; color: var(--color-text-muted); margin-bottom: 2rem;
    display: flex; gap: 0.6rem; align-items: flex-start;
}
.rules-note i { color: var(--color-accent); margin-top: 0.15rem; }

#titleInput {
    display: block; width: 100%; border: none; background: transparent; outline: none;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.3rem);
    color: var(--color-text); padding: 0; margin-bottom: 1.4rem; line-height: 1.28;
}
#titleInput::placeholder { color: var(--color-text-muted); opacity: 0.55; }

#contentInput {
    display: block; width: 100%; border: none; background: transparent; outline: none; resize: none;
    font-family: 'Inter', sans-serif; font-size: 1.05rem; line-height: 1.9; color: var(--color-text);
    min-height: 46vh; padding: 0;
}
#contentInput::placeholder { color: var(--color-text-muted); opacity: 0.55; }

/* ---------- Floating publish bar ---------- */
.publish-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--color-surface); border-top: 1px solid var(--color-border);
    padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: center; gap: 1.2rem;
    box-shadow: 0 -8px 24px rgba(45,27,105,0.06);
}
.publish-bar-inner { width: 100%; max-width: 680px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.word-count { font-size: 0.82rem; color: var(--color-text-muted); display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
.word-count i { color: var(--color-accent); }
.publish-btn {
    display: inline-flex; align-items: center; gap: 0.55rem; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
    color: #fff; font-weight: 700; font-size: 0.95rem; padding: 0.75rem 1.6rem; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(255,107,91,0.3);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.publish-btn:hover { transform: scale(1.045); box-shadow: 0 14px 30px rgba(255,107,91,0.4); }
.publish-btn:active { transform: scale(.94); }
.publish-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.submit-status { font-size: 0.85rem; text-align: center; margin-top: 0.6rem; min-height: 1.2em; }
.submit-status.success { color: var(--color-success); }
.submit-status.error { color: var(--color-error); }

@media (max-width: 560px) {
    .compose-shell { padding: 1.4rem 1.1rem 8rem; }
    .publish-bar-inner { flex-direction: column-reverse; align-items: stretch; gap: 0.6rem; }
    .publish-btn { justify-content: center; }
}
</style>
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">
            <svg width="160" height="45" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" style="display:block;">
              <g transform="translate(45,45)">
                <g transform="rotate(-18)"><ellipse cx="-10" cy="0" rx="20" ry="36" fill="none" stroke="#2D1B69" stroke-width="10"/></g>
                <g transform="rotate(18)"><ellipse cx="10" cy="0" rx="20" ry="36" fill="none" stroke="#FF6B5B" stroke-width="10"/></g>
                <g transform="rotate(-18)"><path d="M -30 0 A 20 36 0 0 1 11 0" fill="none" stroke="#2D1B69" stroke-width="10" stroke-linecap="round"/></g>
              </g>
              <text x="95" y="53" font-size="34" font-weight="700" fill="#2D1B69" font-family="Sora, -apple-system, sans-serif">Bir<tspan fill="#FF6B5B">Millat</tspan></text>
            </svg>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Menyu"><i class="fas fa-bars"></i></button>
        <div class="nav-links" id="navLinks">
            <button class="sidebar-close" id="sidebarClose" aria-label="Yopish"><i class="fas fa-xmark"></i></button>
            <a href="/home"><i class="fas fa-house"></i> Bosh sahifa</a>
            <a href="/recommend"><i class="fas fa-wand-magic-sparkles"></i> Tavsiyalar</a>
            <a href="/events"><i class="fas fa-calendar-days"></i> Tadbirlar</a>
            <a href="/communities"><i class="fas fa-people-group"></i> Jamoalar</a>
            <a href="/volunteer"><i class="fas fa-hand-holding-heart"></i> Volontyorlik</a>
            <a href="/articles" class="active"><i class="fas fa-newspaper"></i> Maqolalar</a>
            <a href="/search"><i class="fas fa-magnifying-glass"></i> Qidiruv</a>
            <a href="/messages"><i class="fas fa-comment-dots"></i> Xabarlar</a>
            <a href="/profile"><i class="fas fa-user"></i> Profil</a>
            <a href="/logout"><i class="fas fa-right-from-bracket"></i> Chiqish</a>
        </div>
        <div class="user-badge" id="userBadge"><img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ...</div>
    <div class="notif-bell-wrap">
        <button class="notif-bell" id="notifBell" aria-label="Bildirishnomalar"><i class="fas fa-bell"></i><span class="notif-dot" id="notifDot"></span></button>
        <div class="notif-panel" id="notifPanel">
            <div class="notif-panel-header">Bildirishnomalar</div>
            <div id="notifList"></div>
        </div>
    </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Mavzuni almashtirish"><i class="fas fa-moon"></i></button>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

    <form class="compose-shell reveal" id="articleForm">
        <div class="compose-eyebrow"><i class="fas fa-pen-nib"></i> Yangi maqola</div>

        <div class="rules-note">
            <i class="fas fa-circle-info"></i>
            <span>Nusxa ko'chirilgan yoki noqonuniy kontent shikoyat qilinishi mumkin. Qoidabuzarlik uchun ogohlantirish beriladi — 3 marta ogohlantirilgan hisoblar bloklanadi.</span>
        </div>

        <input type="text" id="titleInput" placeholder="Sarlavha yozing..." required autocomplete="off">
        <textarea id="contentInput" placeholder="Fikringizni shu yerdan boshlang..." required></textarea>
    </form>

    <div class="publish-bar">
        <div class="publish-bar-inner">
            <span class="word-count" id="wordCount"><i class="fas fa-align-left"></i> 0 so'z</span>
            <button type="submit" form="articleForm" class="publish-btn" id="publishBtn">
                <i class="fas fa-paper-plane"></i> E'lon qilish
            </button>
        </div>
    </div>
    <div class="submit-status" id="submitStatus" style="position:fixed; bottom:4.4rem; left:0; right:0;"></div>

    <script>
        async function loadMe() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login'; return; }
                const me = await res.json();
                document.getElementById('userBadge').innerHTML = '<img src="/icons/icon-user.svg" alt="" style="width:12px; height:12px; vertical-align:-1px;"> ' + me.username;
            } catch (e) { console.error(e); }
        }

        const contentInput = document.getElementById('contentInput');
        const wordCountEl = document.getElementById('wordCount');
        function updateWordCount() {
            const words = contentInput.value.trim().split(/\s+/).filter(Boolean).length;
            wordCountEl.innerHTML = `<i class="fas fa-align-left"></i> ${words} so'z`;
        }
        contentInput.addEventListener('input', updateWordCount);

        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('submitStatus');
            const publishBtn = document.getElementById('publishBtn');
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();

            if (!title || !content) return;

            publishBtn.disabled = true;
            statusEl.textContent = 'Yuborilmoqda...';
            statusEl.className = 'submit-status';

            try {
                const res = await fetch('/api/articles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Server error');

                window.location.href = `/articles/${data.id}`;
            } catch (err) {
                console.error('Article submit failed:', err);
                statusEl.textContent = err.message || "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
                statusEl.className = 'submit-status error';
                publishBtn.disabled = false;
            }
        });

        loadMe();
    </script>
</body>
</html>
